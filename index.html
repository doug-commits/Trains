<div class="app" data-active="false">
  <header class="topbar">
    <button type="button" id="home" class="brand" title="Back to the start">
      <span class="mark" aria-hidden="true"></span>
      <span class="brandtext">Overland<b>SEA</b></span>
    </button>

    <p class="tagline">Rail-first journey planning across Southeast Asia</p>

    <div class="topbar-actions">
      <button type="button" id="theme" class="btn-icon" aria-live="polite">
        <svg class="ic ic-auto" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
          <circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/>

        </svg>
        <svg class="ic ic-light" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
          <circle cx="10" cy="10" r="3.8" fill="currentColor"/>
          <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">

        <span class="sr" id="theme-label">Theme</span>
      </button>
      <button type="button" id="startover" class="btn-ghost">Start over</button>
    </div>
  </header>

  <div class="stage">
    <div class="mapwrap">
      <canvas id="map" aria-label="Map of the Southeast Asian rail, sea and road network"></canvas>
      <div id="tip" class="tip" role="status" hidden></div>

      <div class="mapfoot">
        <div class="legend">
          <span class="key"><i class="line rail"></i>Rail</span>
          <span class="key"><i class="line ferry"></i>Sea</span>
          <span class="key"><i class="line road"></i>Road</span>
          <span class="key"><i class="bmark"></i>Border</span>
          <span class="key"><i class="lmark"></i>Sight</span>
        </div>
        <div class="zoomers">
          <button type="button" id="zoomout" class="btn-zoom" aria-label="Zoom the map out">−</button>
          <button type="button" id="zoomin" class="btn-zoom" aria-label="Zoom the map in">+</button>
        </div>
        <button type="button" id="reset" class="btn-ghost">Reset view</button>
      </div>
    </div>

    <div class="sheet" id="sheet" data-snap="half">
      <button type="button" class="sheet-grip" id="grip" aria-label="Resize the panel">
        <span aria-hidden="true"></span>
      </button>
      <div class="sheet-scroll" id="sheet-scroll">
    <form class="controls" onsubmit="return false" data-collapsed="false">
      <!-- The panel covers northwest Thailand at the default view, which is
           where Chiang Mai, Pai and the Mae Hong Son loop all are. -->
      <button type="button" id="fold" class="fold" aria-expanded="true" aria-controls="controls-body">
        <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
          <path d="M5 8l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="sr" id="fold-label">Hide the search panel</span>
        <span class="fold-what" aria-hidden="true"></span>
      </button>

      <div id="controls-body" class="controls-body">
      <div class="ask">
        <label class="field">
          <span>Where do you want to go?</span>
          <span class="ask-row">
            <input type="text" id="askbox" placeholder="Angkor Wat to Ha Long Bay" autocomplete="off" spellcheck="false">
            <button type="button" id="askgo" class="ask-go">Plan</button>
          </span>
        </label>
        <p id="asknote" class="ask-note" hidden></p>

        <details class="describe">
          <summary><span>Don't know the name? Describe it</span></summary>
          <div class="describe-body">
            <input type="text" id="describebox" class="describe-in"
                   placeholder="the market the train drives through"
                   autocomplete="off" spellcheck="false"
                   aria-describedby="describe-help">
            <p id="describe-help" class="sr">Type what you remember about a place. Results appear below.</p>
            <ul id="describe-out" class="describe-out" role="listbox" aria-label="Places that match"></ul>
          </div>
        </details>
      </div>

      <p class="or"><span>or choose stations</span></p>

      <div class="search">
        <div class="field combo">
          <label class="cap" for="from-q">From</label>
          <input type="text" id="from-q" class="combo-input" role="combobox" aria-expanded="false"
                 aria-controls="from-list" aria-autocomplete="list" aria-describedby="combo-help"
                 placeholder="Type a city or station" autocomplete="off" spellcheck="false">
          <ul id="from-list" class="combo-list" role="listbox" aria-label="Stations" hidden></ul>
        </div>
        <button type="button" id="swap" class="swap" title="Swap origin and destination" aria-label="Swap origin and destination">⇅</button>
        <div class="field combo">
          <label class="cap" for="to-q">To</label>
          <input type="text" id="to-q" class="combo-input" role="combobox" aria-expanded="false"
                 aria-controls="to-list" aria-autocomplete="list" aria-describedby="combo-help"
                 placeholder="Type a city or station" autocomplete="off" spellcheck="false">
          <ul id="to-list" class="combo-list" role="listbox" aria-label="Stations" hidden></ul>
        </div>
        <p id="combo-help" class="sr">Type to filter, arrow keys to move, Enter to choose.</p>
        <!-- The chosen station lives here. The boxes above are how you find it;
             this is what the rest of the app reads, and what a form would post. -->
        <select id="from" class="sr" tabindex="-1" aria-hidden="true"></select>
        <select id="to" class="sr" tabindex="-1" aria-hidden="true"></select>
      </div>

      <details class="details">
        <summary><span>Trip details</span><em id="detail-summary">Pragmatic routing</em></summary>
        <div class="details-body">
          <div class="row tight">
            <label class="field">
              <span>Departing</span>
              <input type="date" id="date">
            </label>
            <label class="field">
              <span>Passport</span>
              <input type="text" id="nationality" placeholder="e.g. British" autocomplete="country-name">
            </label>
            <label class="field">
              <span>Pace</span>
              <select id="pace">
                <option value="relaxed">Relaxed</option>
                <option value="standard">Standard</option>
                <option value="fast">Hard running</option>
              </select>
            </label>
            <label class="field">
              <span>Beds</span>
              <select id="stay">
                <option value="dorm">Hostel</option>
                <option value="room" selected>Private room</option>
                <option value="comfort">Mid-range</option>
              </select>
            </label>
          </div>

          <label class="toggle">
            <input type="checkbox" id="railonly">
            <span class="track" aria-hidden="true"><span class="knob"></span></span>
            <span class="toggle-text">
              <b>Hard rail-only</b>
              <em>Refuse substitute road legs. Station transfers and pier shuttles stay — excluding those wouldn't route around a gap, it would just make the journey impossible.</em>
            </span>
          </label>
        </div>
      </details>
      </div>
    </form>

    <aside id="panel" class="panel" aria-live="polite"></aside>
      </div>
    </div>
  </div>
</div>

/* Overland SEA — a chart console.
 *
 * The map is the ground and the itinerary is a document laid over it, so the
 * palette comes from marine charts rather than from transit apps: deep petrol
 * water, warm land, and a marigold that belongs to this region for the rails.
 *
 * Modes carry both hue and line style, and risk severity is encoded in form as
 * well as colour, so nothing here depends on hue alone.
 */

:root {
  color-scheme: dark;

  --sea: #0a191f;
  --land: #1e373f;
  --land-edge: #335c69;
  --panel: #0d2028;
  --panel-solid: #0d2028;
  --panel-edge: #21414c;
  --raise: #122a33;

  --ink: #e7efea;
  --ink-soft: #c4d6d5;
  --muted: #7d9ba2;

  --rail: #e9a63e;
  --ferry: #57b6c8;
  --road: #978d7f;
  --alert: #e2615a;

  --idle-line: #3a6674;
  --idle-dot: #4c7d8b;

  /* Chart ground. A single flat sea fill over two thirds of the viewport is
     the least interesting thing a map can do; these give it depth without
     touching the palette it already had. */
  --sea-deep: #061217;
  --grid: #16323d;
  --coast: #2d5a6b;
  /* The sights. Distinct from both the rails and the water, because a
     landmark is neither a station nor a leg. */
  --landmark: #b58ac4;

  --panel-w: 29.5rem;
  --topbar-h: 3.5rem;

  /* Shape. The old single 3px value made every surface read as the same kind
     of thing — a technical box. A scale lets a card feel like a card, a chip
     like a chip, and the console frame stay crisp. */
  --r-xs: 4px;
  --r-sm: 7px;
  --r: 11px;
  --r-lg: 16px;
  --radius: var(--r-sm);

  /* Depth. Layered rather than one big drop shadow, so raised surfaces read as
     lifted off the chart instead of floating in front of it. */
  --lift-1: 0 1px 2px rgb(0 0 0 / 0.24);
  --lift-2: 0 4px 10px -4px rgb(0 0 0 / 0.35), 0 1px 2px rgb(0 0 0 / 0.2);
  --lift-3: 0 18px 40px -20px rgb(0 0 0 / 0.6), 0 2px 6px rgb(0 0 0 / 0.25);
  /* A hairline of light along the top edge — the cheapest convincing depth cue
     on a dark ground, and it disappears correctly in light mode. */
  --sheen: inset 0 1px 0 0 rgb(255 255 255 / 0.045);

  --sans: BarlowCond, ui-sans-serif, system-ui, sans-serif;
  --serif: Spectral, Georgia, serif;
  --mono: PlexMono, ui-monospace, SFMono-Regular, monospace;
}

@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --sea: #d7e3e5;
    --land: #f4f2eb;
    --land-edge: #d9d4c6;
    --panel: #fbfaf6;
    --panel-solid: #fbfaf6;
    --panel-edge: #ddd8ca;
    --raise: #efece3;

    --ink: #13212a;
    --ink-soft: #2c3d45;
    --muted: #5b7178;

    --rail: #a96a08;
    --ferry: #1f7c92;
    --road: #7b7263;
    --alert: #b93a2e;

    --idle-line: #aab5b2;
    --idle-dot: #93a09e;

    --sea-deep: #c3d4d7;
    --grid: #c2d2d4;
    --coast: #b7c8ca;
    --landmark: #7a4f8c;

    --lift-1: 0 1px 2px rgb(28 38 44 / 0.07);
    --lift-2: 0 4px 10px -4px rgb(28 38 44 / 0.12), 0 1px 2px rgb(28 38 44 / 0.06);
    --lift-3: 0 18px 40px -20px rgb(28 38 44 / 0.22), 0 2px 6px rgb(28 38 44 / 0.08);
    --sheen: inset 0 1px 0 0 rgb(255 255 255 / 0.7);
  }
}

/* The viewer's own toggle stamps data-theme and must win over the media query
   in both directions. */
:root[data-theme='dark'] {
  color-scheme: dark;
  --sea: #0a191f; --land: #1e373f; --land-edge: #335c69;
  --panel: #0d2028; --panel-solid: #0d2028; --panel-edge: #21414c; --raise: #122a33;
  --ink: #e7efea; --ink-soft: #c4d6d5; --muted: #7d9ba2;
  --rail: #e9a63e; --ferry: #57b6c8; --road: #978d7f; --alert: #e2615a;
  --idle-line: #3a6674; --idle-dot: #4c7d8b;
  --sea-deep: #061217; --grid: #16323d; --coast: #2d5a6b; --landmark: #b58ac4;
}

:root[data-theme='light'] {
  color-scheme: light;
  --sea: #d7e3e5; --land: #f4f2eb; --land-edge: #d9d4c6;
  --panel: #fbfaf6; --panel-solid: #fbfaf6; --panel-edge: #ddd8ca; --raise: #efece3;
  --ink: #13212a; --ink-soft: #2c3d45; --muted: #5b7178;
  --rail: #a96a08; --ferry: #1f7c92; --road: #7b7263; --alert: #b93a2e;
  --idle-line: #aab5b2; --idle-dot: #93a09e;
  --sea-deep: #c3d4d7; --grid: #c2d2d4; --coast: #b7c8ca; --landmark: #7a4f8c;
  --lift-1: 0 1px 2px rgb(28 38 44 / 0.07);
  --lift-2: 0 4px 10px -4px rgb(28 38 44 / 0.12), 0 1px 2px rgb(28 38 44 / 0.06);
  --lift-3: 0 18px 40px -20px rgb(28 38 44 / 0.22), 0 2px 6px rgb(28 38 44 / 0.08);
  --sheen: inset 0 1px 0 0 rgb(255 255 255 / 0.7);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--sea);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

:focus-visible {
  outline: 2px solid var(--rail);
  outline-offset: 2px;
}

/* ------------------------------------------------------------------ frame */

.app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  overflow: hidden;
}

/* --------------------------------------------------------------- topbar */

.topbar {
  flex: none;
  display: flex;
  align-items: center;
  gap: 1.1rem;
  height: var(--topbar-h);
  padding: 0 1.25rem;
  background: var(--panel-solid);
  border-bottom: 1px solid var(--panel-edge);
  box-shadow: 0 1px 0 0 color-mix(in srgb, var(--rail) 22%, transparent);
  z-index: 5;
}

.brand {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  padding: 0.3rem 0.5rem 0.3rem 0.3rem;
  margin-left: -0.3rem;
  background: none;
  border: 0;
  border-radius: var(--r-sm);
  font-family: var(--sans);
  cursor: pointer;
  transition: background 0.15s ease;
}
.brand:hover { background: var(--raise); }

.brand .mark {
  width: 1.6rem;
  height: 0.6rem;
  flex: none;
  background:
    linear-gradient(var(--rail), var(--rail)) left center / 100% 2.5px no-repeat,
    repeating-linear-gradient(90deg, var(--muted) 0 1.5px, transparent 1.5px 5px) center / 100% 100%;
}

.brandtext {
  font-size: 1.08rem;
  font-weight: 500;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
}
.brandtext b { color: var(--ink); font-weight: 600; }

.tagline {
  margin: 0;
  padding-left: 1.1rem;
  border-left: 1px solid var(--panel-edge);
  font-size: 0.92rem;
  color: var(--muted);
  white-space: nowrap;
}

.topbar-actions { margin-left: auto; display: flex; gap: 0.5rem; }

/* Nothing to start over from until a route exists. */
.app[data-active='false'] #startover { display: none; }

.btn-ghost {
  padding: 0.42rem 0.75rem;
  font-family: var(--sans);
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--muted);
  background: color-mix(in srgb, var(--panel) 85%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--panel-edge);
  border-radius: var(--r-sm);
  cursor: pointer;
  transition: color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
}
.btn-ghost:hover {
  color: var(--ink);
  border-color: var(--muted);
  box-shadow: var(--lift-1);
}

/* A square icon button, and the only place in the chrome where an icon carries
   the meaning on its own — so it also carries a screen-reader label that names
   the current mode and what the next click does. */
.btn-icon {
  position: relative;
  display: grid;
  place-items: center;
  width: 2.25rem;
  height: 2.25rem;
  padding: 0;
  color: var(--muted);
  background: color-mix(in srgb, var(--panel) 85%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--panel-edge);
  border-radius: var(--r-sm);
  cursor: pointer;
  transition: color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
}
.btn-icon:hover {
  color: var(--rail);
  border-color: var(--muted);
  box-shadow: var(--lift-1);
}
.btn-icon .ic {
  grid-area: 1 / 1;
  width: 1.1rem;
  height: 1.1rem;
  display: none;
}
/* One icon at a time, chosen by the mode stamped on the button. Auto shows a
   half-filled disc because it is neither one thing nor the other. */
.btn-icon[data-mode='auto'] .ic-auto,
.btn-icon[data-mode='light'] .ic-light,
.btn-icon[data-mode='dark'] .ic-dark { display: block; }

/* Visible to assistive tech, invisible on screen. */
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  border: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

/* Nothing on the page should snap between two palettes; the surfaces cross-fade
   while the map redraws. Respects a reduced-motion preference. */
@media (prefers-reduced-motion: no-preference) {
  body,
  .topbar,
  .panel,
  .controls,
  .corridor,
  .day,
  .stays > li,
  .callout,
  .compare,
  .route tr.leg > td {
    transition: background-color 0.28s ease, border-color 0.28s ease, color 0.28s ease;
  }
}

/* ---------------------------------------------------------------- stage */

.stage {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
}

.mapwrap { position: absolute; inset: 0; }

#map {
  display: block;
  width: 100%;
  height: 100%;
  cursor: grab;
  /* Every touch comes to us, including the vertical ones the browser would
   * otherwise scroll with. That is not the map claiming the gesture: it is the
   * only way to give the map the part of a drag it can use and pass the rest
   * to the page, which is what app.js does. Handing vertical to the browser
   * instead means the map can never be moved up or down at all. */
  touch-action: none;
}

/* ---------------------------------------------------------- map controls */

/* Beside "Reset view", which is the one strip of map guaranteed to be clear
 * of both the controls and the result panel. */
.zoomers {
  display: flex;
  gap: 1px;
  border-radius: var(--r-sm);
  overflow: hidden;
  box-shadow: var(--lift-1);
}

.btn-zoom {
  width: 1.9rem;
  height: 1.9rem;
  border: 0;
  font: inherit;
  font-size: 1.1rem;
  line-height: 1;
  cursor: pointer;
  color: var(--ink);
  background: color-mix(in srgb, var(--panel) 94%, transparent);
  backdrop-filter: blur(16px) saturate(1.3);
  transition: background 0.15s ease;
}

.btn-zoom:hover { background: var(--panel); }
.btn-zoom:active { background: color-mix(in srgb, var(--panel) 80%, var(--ink)); }


/* ------------------------------------------------------------- controls */

.controls {
  position: absolute;
  top: 1.1rem;
  left: 1.1rem;
  width: 24rem;
  max-width: calc(100vw - 2.2rem);
  padding: 1.15rem 1.2rem;
  display: flex;
  flex-direction: column;
  gap: 0.85rem;
  background: color-mix(in srgb, var(--panel) 92%, transparent);
  backdrop-filter: blur(16px) saturate(1.3);
  -webkit-backdrop-filter: blur(16px) saturate(1.3);
  border: 1px solid var(--panel-edge);
  border-radius: var(--r);
  box-shadow: var(--lift-3), var(--sheen);
  z-index: 3;
}

/* A paid link. Deliberately quieter than the operator booking links above it —
   the thing you came for outranks the thing that pays. */
.stay-book {
  display: inline-block;
  margin-top: 0.4rem;
  font-family: var(--sans);
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--muted);
  text-decoration: none;
  border-bottom: 1px solid color-mix(in srgb, var(--muted) 45%, transparent);
  transition: color 0.15s ease, border-color 0.15s ease;
}
.stay-book:hover { color: var(--ink); border-bottom-color: var(--rail); }

.disclosure b { color: var(--ink-soft); }

/* ------------------------------------------------- describing a place */

.describe { margin-top: 0.15rem; }

.describe summary {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.15rem 0;
  font-family: var(--sans);
  font-size: 0.82rem;
  color: var(--muted);
  cursor: pointer;
  list-style: none;
}
.describe summary::-webkit-details-marker { display: none; }
.describe summary::before {
  content: '';
  width: 0.42rem;
  height: 0.42rem;
  border-right: 1.5px solid currentColor;
  border-bottom: 1.5px solid currentColor;
  transform: rotate(-45deg);
  transition: transform 0.15s ease;
}
.describe[open] summary::before { transform: rotate(45deg); }
.describe summary:hover { color: var(--ink); }

.describe-body {
  display: flex;
  flex-direction: column;
  gap: 0.45rem;
  padding-top: 0.5rem;
}

.describe-in {
  width: 100%;
  padding: 0.5rem 0.6rem;
  font-family: var(--sans);
  font-size: 0.95rem;
  color: var(--ink);
  background: var(--raise);
  border: 1px solid var(--panel-edge);
  border-radius: var(--r-sm);
}
.describe-in:hover { border-color: var(--muted); }

.describe-out { margin: 0; padding: 0; list-style: none; }
.describe-out:empty { display: none; }

.describe-out li {
  padding: 0.5rem 0.55rem;
  border-radius: var(--r-xs);
  border-bottom: 1px solid color-mix(in srgb, var(--panel-edge) 55%, transparent);
}
.describe-out li:last-child { border-bottom: 0; }

.d-name {
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
  font-family: var(--sans);
  font-size: 0.95rem;
  font-weight: 500;
  color: var(--ink);
}
.d-kind {
  font-family: var(--mono);
  font-size: 0.66rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}

/* The evidence. A match you cannot explain is a guess, and this is a search
   over prose — the reader should see the sentence that earned the hit. */
.d-why {
  display: block;
  margin: 0.2rem 0 0.35rem;
  font-size: 0.85rem;
  line-height: 1.4;
  color: var(--muted);
}
.d-why b { color: var(--ink-soft); font-weight: 600; }

.d-acts { display: flex; gap: 0.35rem; }

.d-acts button {
  padding: 0.25rem 0.5rem;
  font-family: var(--sans);
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  color: var(--muted);
  background: var(--raise);
  border: 1px solid var(--panel-edge);
  border-radius: var(--r-xs);
  cursor: pointer;
  transition: color 0.15s ease, border-color 0.15s ease;
}
.d-acts button:hover { color: var(--ink); border-color: var(--rail); }

.describe-none {
  padding: 0.4rem 0.55rem;
  font-size: 0.85rem;
  color: var(--muted);
}

/* ------------------------------------------------------------ folding away */

/* At the default view this panel sits over northwest Thailand — Chiang Mai,
   Pai, the whole Mae Hong Son loop. Folding it gives that corner back without
   losing the route you already picked, which the collapsed bar keeps showing. */
.controls-body { display: contents; }

.controls[data-collapsed='true'] { gap: 0; padding: 0.5rem 0.6rem; width: auto; }
.controls[data-collapsed='true'] .controls-body { display: none; }

.fold {
  align-self: flex-end;
  display: flex;
  align-items: center;
  gap: 0.4rem;
  margin: -0.35rem -0.35rem 0 0;
  padding: 0.3rem 0.4rem;
  color: var(--muted);
  background: none;
  border: 0;
  border-radius: var(--r-xs);
  cursor: pointer;
  transition: color 0.15s ease, background 0.15s ease;
}
.fold:hover { color: var(--ink); background: var(--raise); }

.fold svg {
  width: 1.15rem;
  height: 1.15rem;
  flex: none;
  transition: transform 0.2s ease;
}

.controls[data-collapsed='true'] .fold {
  align-self: auto;
  margin: 0;
  flex-direction: row-reverse;
}
.controls[data-collapsed='true'] .fold svg { transform: rotate(-90deg); }

/* Empty until there is a route, so the folded panel is just a chevron when it
   has nothing to report. */
.fold-what {
  display: none;
  max-width: 14rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--sans);
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--ink);
}
.controls[data-collapsed='true'] .fold-what:not(:empty) { display: block; }

@media (prefers-reduced-motion: reduce) {
  .fold svg { transition: none; }
}

.search {
  display: flex;
  align-items: flex-end;
  gap: 0.5rem;
}
.search .field { flex: 1 1 0; min-width: 0; }

.row { display: flex; align-items: flex-end; gap: 0.5rem; }
.row.tight { gap: 0.4rem; }
.row .field { flex: 1 1 7.5rem; min-width: 0; }

.field { display: flex; flex-direction: column; gap: 0.25rem; }

/* Links to the written-up routes. Real anchors, so a crawler arriving at the
   homepage can walk to every page from here — and so can a reader who would
   rather read one than operate the planner. */
.guides { margin: 0; padding: 0; list-style: none; }

.guides li {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.2rem 0.7rem;
  padding: 0.45rem 0;
  border-bottom: 1px solid color-mix(in srgb, var(--panel-edge) 55%, transparent);
}

.guides a {
  font-family: var(--sans);
  font-size: 1rem;
  font-weight: 500;
  color: var(--ink);
  text-decoration: none;
  border-bottom: 1px solid color-mix(in srgb, var(--rail) 40%, transparent);
}
.guides a:hover { color: var(--rail); border-bottom-color: var(--rail); }

.guides span {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

/* ------------------------------------------------------------- combobox */

/* Two hundred stations in a native select means scrolling past nine countries
   to reach Surabaya. Typing three letters should get you there instead. */
.combo { position: relative; }

.combo-list {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  z-index: 20;
  margin: 0.3rem 0 0;
  padding: 0.25rem;
  max-height: 17rem;
  overflow-y: auto;
  overscroll-behavior: contain;
  list-style: none;
  background: var(--panel-solid);
  border: 1px solid var(--panel-edge);
  border-radius: var(--r-sm);
  box-shadow: var(--lift-3), var(--sheen);
}

.combo-list li {
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
  padding: 0.4rem 0.55rem;
  border-radius: var(--r-xs);
  font-family: var(--sans);
  font-size: 0.95rem;
  line-height: 1.35;
  cursor: pointer;
}

.combo-list li[aria-selected='true'],
.combo-list li:hover { background: var(--raise); }

/* The country each run of stations belongs to.
   Sticky, because the whole point is knowing where you are in a list of two
   hundred — a heading that scrolls away answers the question only until you
   start looking. Countries are ordered by how well they match what was typed,
   not alphabetically; see byCountry in app.js. */
.combo-group {
  position: sticky;
  top: -0.25rem;
  z-index: 1;
  margin: 0.25rem -0.25rem 0.1rem;
  padding: 0.35rem 0.8rem 0.3rem;
  background: var(--panel-solid);
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  border-bottom: 1px solid var(--panel-edge);
}
.combo-group:first-child { margin-top: -0.25rem; }
.combo-list li.combo-group:hover { background: var(--panel-solid); }

/* The station rows sit in under their heading. */
.combo-list li[data-i] { padding-left: 0.9rem; }

.combo-list b { font-weight: 600; color: var(--rail); }

.combo-empty {
  padding: 0.55rem;
  font-family: var(--sans);
  font-size: 0.9rem;
  color: var(--muted);
  cursor: default;
}
.combo-empty:hover { background: none; }

/* Same caption treatment the wrapping-label fields get. */
.field > .cap {
  font-family: var(--sans);
  font-size: 0.82rem;
  font-weight: 500;
  letter-spacing: 0.01em;
  color: var(--muted);
}

/* These were uppercase and letterspaced like the section headings, which put
   nine shouted labels on one panel and left nothing leading. Sentence case
   demotes them to what they are: captions on an input. */
.field > span {
  font-family: var(--sans);
  font-size: 0.82rem;
  font-weight: 500;
  letter-spacing: 0.01em;
  color: var(--muted);
}

.field select,
.field input {
  width: 100%;
  min-width: 0;
  padding: 0.58rem 0.62rem;
  font-family: var(--sans);
  font-size: 1rem;
  font-weight: 500;
  color: var(--ink);
  background: var(--raise);
  border: 1px solid var(--panel-edge);
  border-radius: var(--r-sm);
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.field select:hover,
.field input:hover { border-color: var(--muted); }
.field select:focus,
.field input:focus {
  border-color: var(--rail);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--rail) 16%, transparent);
}

.swap {
  flex: none;
  width: 2.2rem;
  height: 2.2rem;
  margin-bottom: 0.05rem;
  font-size: 1rem;
  color: var(--muted);
  background: var(--raise);
  border: 1px solid var(--panel-edge);
  border-radius: var(--r-sm);
  cursor: pointer;
  transition: color 0.15s ease, border-color 0.15s ease;
}
.swap:hover { color: var(--rail); border-color: var(--rail); }

/* The four secondary inputs shouted as loudly as the two that matter, so they
   fold away until asked for. */
.details {
  border-top: 1px solid var(--panel-edge);
  padding-top: 0.6rem;
}
.details > summary {
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
  list-style: none;
  cursor: pointer;
  font-family: var(--sans);
}
.details > summary::-webkit-details-marker { display: none; }
.details > summary > span {
  font-size: 0.88rem;
  font-weight: 600;
  letter-spacing: 0.01em;
  color: var(--ink-soft);
}
.details > summary > span::after {
  content: ' ▸';
  color: var(--muted);
}
.details[open] > summary > span::after { content: ' ▾'; }
.details > summary > em {
  font-style: normal;
  font-size: 0.82rem;
  color: var(--muted);
  margin-left: auto;
  text-align: right;
}
.details-body {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  padding-top: 0.75rem;
}

.toggle {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 0.6rem;
  align-items: start;
  cursor: pointer;
}
/* Visually hidden but still focusable and hit-testable — a zero-size box gets
   skipped by some assistive tech and by automation. */
.toggle > input {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  border: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.toggle .track {
  width: 2.15rem;
  height: 1.15rem;
  margin-top: 0.1rem;
  background: var(--raise);
  border: 1px solid var(--panel-edge);
  border-radius: 1rem;
  position: relative;
  transition: background 0.16s ease, border-color 0.16s ease;
}
.toggle .knob {
  position: absolute;
  top: 0.125rem;
  left: 0.15rem;
  width: 0.8rem;
  height: 0.8rem;
  border-radius: 50%;
  background: var(--muted);
  transition: transform 0.16s ease, background 0.16s ease;
}
.toggle > input:checked + .track { border-color: var(--rail); }
.toggle > input:checked + .track .knob { transform: translateX(0.95rem); background: var(--rail); }
.toggle > input:focus-visible + .track { outline: 2px solid var(--rail); outline-offset: 2px; }

.toggle-text { font-family: var(--sans); line-height: 1.35; }
.toggle-text b { display: block; font-size: 0.95rem; font-weight: 600; }
.toggle-text em {
  display: block;
  margin-top: 0.15rem;
  font-style: normal;
  font-size: 0.8rem;
  color: var(--muted);
}

/* --------------------------------------------------------------- mapfoot */

.mapfoot {
  position: absolute;
  left: 1.1rem;
  bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  z-index: 3;
}

.legend {
  display: flex;
  gap: 0.85rem;
  padding: 0.42rem 0.7rem;
  background: color-mix(in srgb, var(--panel) 85%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--panel-edge);
  border-radius: var(--r);
  font-family: var(--sans);
  font-size: 0.8rem;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}
.key { display: flex; align-items: center; gap: 0.35rem; }
.line { width: 1.4rem; height: 0; border-top-width: 2.5px; }
.line.rail { border-top: 2.5px solid var(--rail); }
.line.ferry { border-top: 2.5px dashed var(--ferry); }
.line.road { border-top: 2.5px dotted var(--road); }
.bmark {
  width: 0.5rem; height: 0.5rem;
  background: var(--alert);
  transform: rotate(45deg);
}
/* Hollow, matching the map: a sight is somewhere you go, not somewhere a train
   stops, and it should never be mistaken for a station. */
.lmark {
  width: 0.5rem; height: 0.5rem;
  border: 1.3px solid var(--landmark);
  transform: rotate(45deg);
}

/* ------------------------------------------------------------------- tip */

.tip {
  position: absolute;
  z-index: 4;
  max-width: 19rem;
  padding: 0.6rem 0.7rem;
  /* A leg tooltip is a label and must not intercept the drag. A station popup
     has buttons in it and has to be reachable — see .tip.live. */
  pointer-events: none;
  background: var(--panel-solid);
  border: 1px solid var(--panel-edge);
  border-radius: var(--r);
  box-shadow: var(--lift-3), var(--sheen);
  font-family: var(--sans);
  line-height: 1.35;
}
.tip.live { pointer-events: auto; }

/* Out to the real map, at the two moments it helps: where exactly is this, and
   how do I cover the last mile the railway does not. */
.tip-links {
  display: flex !important;
  flex-wrap: wrap;
  gap: 0.15rem 0.9rem;
  margin-top: 0.45rem;
}
.tip-map {
  font-family: var(--sans);
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--rail);
  text-decoration: none;
}
.tip-map:hover { text-decoration: underline; text-underline-offset: 3px; }

.ask-note .tip-map { margin-left: 0.3rem; white-space: nowrap; }

/* Start here / end here. The two things anyone wants from a point on a map. */
.tip-acts {
  display: flex !important;
  flex-wrap: wrap;
  gap: 0.35rem;
  margin-top: 0.55rem;
  padding-top: 0.55rem;
  border-top: 1px solid var(--panel-edge);
}
.tip-go {
  flex: 1 1 auto;
  padding: 0.34rem 0.5rem;
  font-family: var(--sans);
  font-size: 0.8rem;
  font-weight: 600;
  text-align: center;
  color: var(--ink-soft);
  background: var(--raise);
  border: 1px solid var(--panel-edge);
  border-radius: var(--r-sm);
  cursor: pointer;
  white-space: nowrap;
  transition: color 0.14s ease, border-color 0.14s ease, background 0.14s ease;
}
.tip-go:hover {
  color: var(--sea);
  background: var(--rail);
  border-color: var(--rail);
}
/* Already one end of the current route — a statement, not an offer. */
.tip-go.on {
  color: var(--rail);
  border-color: color-mix(in srgb, var(--rail) 55%, var(--panel-edge));
  background: color-mix(in srgb, var(--rail) 12%, transparent);
  cursor: default;
}
.tip-go.on:hover { color: var(--rail); background: color-mix(in srgb, var(--rail) 12%, transparent); }
.tip b { display: block; font-size: 1rem; font-weight: 600; }
.tip span { display: block; font-size: 0.82rem; color: var(--muted); }
/* The road gap between a sight and the railhead that serves it. Warm rather
   than alarming — it is a fact about the journey, not a warning. */
.tip em.gap {
  color: var(--ink-soft);
  border-top-color: var(--panel-edge);
}

.tip em {
  display: block;
  margin-top: 0.3rem;
  padding-top: 0.3rem;
  border-top: 1px solid var(--panel-edge);
  font-style: normal;
  font-size: 0.8rem;
  color: var(--alert);
}

/* ----------------------------------------------------------------- panel */

.panel {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: var(--panel-w);
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 2.2rem 2.1rem 5rem;
  z-index: 2;
  background: color-mix(in srgb, var(--panel) 93%, transparent);
  backdrop-filter: blur(18px) saturate(1.2);
  -webkit-backdrop-filter: blur(18px) saturate(1.2);
  border-left: 1px solid var(--panel-edge);
  box-shadow: -28px 0 60px -30px rgb(0 0 0 / 0.55);
}

/* --------------------------------------------------------------- heading */

.head { margin-bottom: 1.6rem; }

.eyebrow {
  margin: 0 0 0.7rem;
  font-family: var(--mono);
  font-size: 0.7rem;
  font-weight: 400;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}

.panel h1 {
  margin: 0 0 1rem;
  font-family: var(--sans);
  font-size: clamp(1.9rem, 3.4vw, 2.5rem);
  font-weight: 600;
  line-height: 1.02;
  letter-spacing: -0.005em;
  text-wrap: balance;
}
.panel h1 span { color: var(--rail); font-weight: 500; }

.lede {
  margin: 0;
  font-size: 1.02rem;
  line-height: 1.62;
  color: var(--ink-soft);
  max-width: 34em;
}

.sub {
  margin: 0.6rem 0 0;
  font-size: 0.92rem;
  line-height: 1.55;
  color: var(--muted);
  max-width: 36em;
}
.sub.foot { margin-top: 1.1rem; }

/* ----------------------------------------------------------------- stats */

/* A grid rather than a wrapping flex row. Seven stats in a flex row broke into
   ragged lines at a different point on every route; a fixed track count means
   the numbers line up under each other whatever the itinerary is. */
.stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0.7rem 1rem;
  margin: 0 0 1.2rem;
  padding: 0.95rem 0;
  border-top: 1px solid var(--panel-edge);
  border-bottom: 1px solid var(--panel-edge);
}
.stat { display: flex; flex-direction: column; gap: 0.1rem; min-width: 0; }
.stat b {
  font-family: var(--mono);
  font-size: 1.12rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.stat span {
  font-family: var(--sans);
  font-size: 0.74rem;
  font-weight: 500;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--muted);
}

/* --------------------------------------------------------------- blocks */

.block { margin-top: 2.7rem; }

.panel h2 {
  margin: 0;
  padding-bottom: 0.45rem;
  border-bottom: 2px solid var(--rail);
  font-family: var(--sans);
  font-size: 0.88rem;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink);
}

.panel h3 {
  margin: 0;
  font-family: var(--sans);
  font-size: 1.06rem;
  font-weight: 600;
  line-height: 1.25;
  text-wrap: balance;
}

.panel p { margin: 0.5rem 0 0; }
.panel a { color: var(--rail); text-underline-offset: 2px; }

/* -------------------------------------------------------------- callouts */

.callout {
  margin-top: 1.2rem;
  padding: 0.85rem 1rem;
  background: var(--raise);
  border: 1px solid var(--panel-edge);
  border-radius: var(--r);
}
.callout.alert {
  border-color: color-mix(in srgb, var(--alert) 55%, var(--panel-edge));
  background: color-mix(in srgb, var(--alert) 9%, var(--raise));
}
.callout h3 { font-size: 0.98rem; }
.callout p { font-size: 0.93rem; color: var(--ink-soft); }

.warns { margin: 0.5rem 0 0; padding-left: 1rem; }
.warns li { font-size: 0.92rem; color: var(--ink-soft); margin-top: 0.35rem; }
.warns b { font-family: var(--sans); font-weight: 600; }

/* ----------------------------------------------------------- route table */

.table-wrap { overflow-x: auto; margin-top: 0.9rem; }

table { width: 100%; border-collapse: collapse; }

.route thead th {
  padding: 0 0.4rem 0.4rem;
  text-align: left;
  font-family: var(--sans);
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--muted);
  border-bottom: 1px solid var(--panel-edge);
}
.num-col { text-align: right; }

.route tr.leg { cursor: default; }
.route tr.leg > td {
  padding: 0.8rem 0.45rem;
  vertical-align: top;
  border-bottom: 1px solid color-mix(in srgb, var(--panel-edge) 60%, transparent);
  transition: background 0.14s ease;
}
.route tr.leg:hover > td,
.route tr.leg:focus-visible > td {
  background: color-mix(in srgb, var(--raise) 70%, transparent);
}

.route .num {
  width: 2.2rem;
  font-family: var(--mono);
  font-size: 0.82rem;
  color: var(--muted);
  white-space: nowrap;
}
.mode-dot {
  display: inline-block;
  width: 0.42rem;
  height: 0.42rem;
  margin-right: 0.4rem;
  vertical-align: 0.05rem;
  border-radius: 50%;
}
.mode-dot.rail { background: var(--rail); }
.mode-dot.ferry { background: var(--ferry); }
.mode-dot.road { background: var(--road); }

.where { font-family: var(--sans); line-height: 1.3; }
.where b { font-size: 0.98rem; font-weight: 600; }
.where .arrow { color: var(--rail); margin: 0 0.3rem; }
.where .svc {
  display: block;
  margin-top: 0.12rem;
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--muted);
}
.where .cls {
  margin-left: 0.4rem;
  padding-left: 0.4rem;
  border-left: 1px solid var(--panel-edge);
}
.where .leg-note {
  display: block;
  margin-top: 0.35rem;
  font-family: var(--serif);
  font-size: 0.88rem;
  line-height: 1.5;
  color: var(--ink-soft);
}

.op { white-space: nowrap; }
.op-name {
  display: block;
  font-family: var(--sans);
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--ink-soft);
}
.tag {
  display: inline-block;
  margin-top: 0.2rem;
  padding: 0.02rem 0.3rem;
  font-family: var(--mono);
  font-size: 0.64rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  border: 1px solid currentColor;
  border-radius: var(--r-xs);
  color: var(--muted);
}
.tag.warn { color: var(--alert); }

.dur, .fare {
  font-family: var(--mono);
  font-size: 0.85rem;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.fare { color: var(--muted); }

.route tr.junction > td {
  padding: 0.3rem 0.4rem 0.55rem;
  font-family: var(--sans);
  font-size: 0.82rem;
  border-bottom: 1px solid color-mix(in srgb, var(--panel-edge) 60%, transparent);
}
.j-label { font-weight: 600; color: var(--muted); }
.j-buffer {
  margin-left: 0.45rem;
  padding: 0.02rem 0.32rem;
  font-family: var(--mono);
  font-size: 0.74rem;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  background: var(--raise);
  border: 1px solid var(--panel-edge);
  border-radius: var(--r-xs);
}
.j-rule { display: block; margin-top: 0.15rem; color: var(--muted); }
.route tr.junction.warn .j-buffer {
  color: var(--alert);
  border-color: color-mix(in srgb, var(--alert) 50%, var(--panel-edge));
}

/* --------------------------------------------------------------- borders */

.crossing {
  margin-top: 1.4rem;
  padding-top: 1.1rem;
  border-top: 1px solid var(--panel-edge);
}
.crossing.hard { border-top-color: var(--alert); border-top-width: 2px; }

.crossing header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.75rem;
  flex-wrap: wrap;
}
.crossing .countries {
  font-family: var(--mono);
  font-size: 0.72rem;
  letter-spacing: 0.05em;
  color: var(--muted);
  white-space: nowrap;
}

.crossing dl {
  display: grid;
  grid-template-columns: minmax(6.5rem, auto) 1fr;
  gap: 0.32rem 0.9rem;
  margin: 0.8rem 0 0;
}
.crossing dt {
  font-family: var(--sans);
  font-size: 0.76rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  padding-top: 0.12rem;
}
.crossing dd {
  margin: 0;
  font-size: 0.93rem;
  line-height: 1.5;
  color: var(--ink-soft);
}

.trap {
  margin-top: 0.85rem !important;
  padding: 0.7rem 0.85rem;
  font-size: 0.93rem;
  line-height: 1.55;
  background: var(--raise);
  border-radius: var(--r);
}
.trap b {
  font-family: var(--sans);
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--alert);
}
.trap.verify b { color: var(--ferry); }

/* ----------------------------------------------------------------- risks */

.risks { margin: 0; padding: 0; list-style: none; }

.risk {
  padding: 1.1rem 0;
  border-bottom: 1px solid var(--panel-edge);
}
.risk:first-child { padding-top: 1.2rem; }

.sev {
  display: inline-block;
  margin-bottom: 0.4rem;
  padding: 0.06rem 0.4rem;
  font-family: var(--mono);
  font-size: 0.64rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  border-radius: var(--r-xs);
}
/* Severity reads through fill weight as well as hue. */
.risk.critical .sev { color: var(--sea); background: var(--alert); }
.risk.caution .sev { color: var(--alert); border: 1px solid var(--alert); }
.risk.note .sev { color: var(--ferry); border: 1px solid var(--ferry); }

.risk p { font-size: 0.95rem; color: var(--ink-soft); }
.risk .fix { color: var(--muted); }
.risk .fix b {
  font-family: var(--sans);
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--ink-soft);
}

/* --------------------------------------------------------------- booking */

.booking { margin: 0; padding: 0; list-style: none; counter-reset: none; }
.booking li {
  display: grid;
  grid-template-columns: 1.9rem 1fr;
  gap: 0.75rem;
  padding: 1rem 0;
  border-bottom: 1px solid var(--panel-edge);
}
.booking .rank {
  font-family: var(--mono);
  font-size: 1.15rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--rail);
  line-height: 1.15;
}
.booking .window {
  font-family: var(--sans);
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--muted);
  margin-top: 0.15rem !important;
}
.booking p { font-size: 0.93rem; color: var(--ink-soft); }

.book {
  display: inline-block;
  margin-top: 0.5rem;
  font-family: var(--mono);
  font-size: 0.78rem;
  color: var(--rail);
}
.book.none { color: var(--muted); }

/* ----------------------------------------------------------------- costs */

.costs td {
  padding: 0.42rem 0;
  font-size: 0.94rem;
  border-bottom: 1px solid color-mix(in srgb, var(--panel-edge) 60%, transparent);
}
.costs .num-col {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.costs .saved td { color: var(--muted); font-size: 0.88rem; }
.costs .total td {
  padding-top: 0.6rem;
  font-family: var(--sans);
  font-size: 1.05rem;
  font-weight: 600;
  border-bottom: none;
  border-top: 1px solid var(--panel-edge);
}
.costs .total .num-col { font-family: var(--mono); color: var(--rail); }

.compare {
  margin-top: 1.3rem;
  padding: 0.9rem 1rem;
  background: var(--raise);
  border: 1px solid var(--panel-edge);
  border-radius: var(--r);
}
.compare h3 { font-size: 0.82rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.compare p { font-size: 0.94rem; color: var(--ink-soft); }
.compare .honest { color: var(--muted); font-size: 0.91rem; }

/* --------------------------------------------------------------- detours */

.detours { margin: 0; padding: 0; list-style: none; }
.detours li { padding: 1rem 0; border-bottom: 1px solid var(--panel-edge); }
.detours .cost {
  display: inline-block;
  margin-top: 0.25rem;
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--rail);
}
.detours p { font-size: 0.94rem; color: var(--ink-soft); }

/* ------------------------------------------------------------ idle state */

.chips { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 1rem; }

/* A corridor card carries its real numbers, so the choice is informed before
   the click rather than after it. */
.corridor {
  position: relative;
  display: block;
  width: 100%;
  padding: 0.95rem 1.05rem 1.05rem;
  text-align: left;
  font-family: var(--sans);
  color: var(--ink);
  background: var(--raise);
  border: 1px solid var(--panel-edge);
  border-radius: var(--r);
  box-shadow: var(--lift-1), var(--sheen);
  cursor: pointer;
  overflow: hidden;
  transition: border-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
}
/* Lifting reads as "this is a thing you can take" far better than the sideways
   nudge did, and it does not shift the text under the cursor mid-click. */
.corridor:hover {
  border-color: color-mix(in srgb, var(--rail) 45%, var(--panel-edge));
  transform: translateY(-2px);
  box-shadow: var(--lift-3), var(--sheen);
}
.corridor:active { transform: translateY(0); box-shadow: var(--lift-1), var(--sheen); }
/* The photograph creeps outward as the card lifts — a small thing, and the
   difference between a card that responds and one that just changes colour. */
.corridor .photo,
.corridor canvas.scene { transition: transform 0.5s cubic-bezier(0.2, 0.7, 0.3, 1); }
.corridor:hover .photo,
.corridor:hover canvas.scene { transform: scale(1.035); }

.corridor-name {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.5rem;
  font-size: 1.12rem;
  font-weight: 600;
  letter-spacing: -0.005em;
}
.corridor-name em {
  font-style: normal;
  font-size: 0.95rem;
  color: var(--rail);
}
.corridor-note {
  display: block;
  margin-top: 0.22rem;
  font-size: 0.88rem;
  line-height: 1.45;
  color: var(--muted);
}
.corridor-stats {
  display: flex;
  flex-wrap: wrap;
  gap: 0 0.85rem;
  margin-top: 0.7rem;
  padding-top: 0.6rem;
  border-top: 1px solid var(--panel-edge);
  font-size: 0.76rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}
.corridor-stats b {
  font-family: var(--mono);
  font-size: 0.86rem;
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  letter-spacing: 0;
  text-transform: none;
  color: var(--ink);
  margin-right: 0.22rem;
}

.myths { margin: 0.9rem 0 0; padding: 0; list-style: none; }
.myths li { padding: 0.8rem 0; border-bottom: 1px solid var(--panel-edge); }
.myths .belief {
  display: block;
  font-family: var(--sans);
  font-size: 0.98rem;
  font-weight: 600;
  color: var(--muted);
}
.myths .belief::before { content: '“'; }
.myths .belief::after { content: '”'; }
.myths .reality {
  display: block;
  margin-top: 0.25rem;
  font-size: 0.94rem;
  line-height: 1.5;
  color: var(--ink-soft);
}

/* ------------------------------------------------------------- foot note */

.foot-note {
  margin-top: 2.4rem;
  padding-top: 1rem;
  border-top: 1px solid var(--panel-edge);
}
.foot-note p {
  margin: 0;
  font-size: 0.85rem;
  line-height: 1.55;
  color: var(--muted);
}

/* ------------------------------------------------------------ responsive */

/* Below the breakpoint the three panes stop overlapping and simply stack:
   controls, then a sticky map that stays in view while the itinerary scrolls
   past it, then the itinerary. */
/* On a wide screen the sheet is not a box at all — the controls and the panel
   go on positioning themselves against the stage exactly as they always have.
   display:contents makes the wrapper vanish from layout rather than having to
   be undone rule by rule. */
.sheet,
.sheet-scroll { display: contents; }
.sheet-grip { display: none; }

/* Website-only. These link to the written-up route pages, which are separate
   documents on the site and are not inside the app — the app is one file, so
   every one of those links would be a dead end. */
[data-app='true'] .block-web { display: none; }

/* ------------------------------------------------------------ on a phone */

/* The map is the page, and the itinerary is a sheet drawn over it.
 *
 * The stacked version — a letterbox of map with the route scrolling beneath —
 * made both halves worse. The map was too short to examine a route in and
 * fought the page for every vertical drag; the route could only be read by
 * pushing the map off the top of the screen. Neither is a thing you can do at
 * a station with one hand.
 *
 * So: the map takes the whole screen and keeps it, and the sheet slides up
 * over it as far as you want it. Three positions, because two is not enough to
 * both glance at the next departure and read the whole itinerary. */
@media (max-width: 60rem) {
  .app {
    height: 100dvh;
    min-height: 0;
    overflow: hidden;
  }

  /* Floating over the map rather than sitting above it — there is no column
     left for it to sit in. */
  .topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 40;
    padding: 0 0.85rem;
    padding-top: env(safe-area-inset-top);
    background: color-mix(in srgb, var(--panel) 82%, transparent);
    backdrop-filter: blur(14px) saturate(1.2);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    border-bottom: 1px solid var(--panel-edge);
  }
  .tagline { display: none; }

  .stage { display: block; height: 100dvh; }
  .mapwrap { position: fixed; inset: 0; z-index: 1; }

  /* Under the top bar rather than above the sheet, which slides over anything
     put at the bottom. Wrapping, because the legend and three controls do not
     fit across a phone in one line and half of Reset view over the edge is
     worse than a second row. */
  .mapfoot {
    left: max(0.6rem, env(safe-area-inset-left));
    right: max(0.6rem, env(safe-area-inset-right));
    bottom: auto;
    top: calc(var(--topbar-h) + env(safe-area-inset-top) + 0.5rem);
    flex-wrap: wrap;
    gap: 0.5rem;
    z-index: 20;
  }
  .legend { flex: 1 1 100%; flex-wrap: wrap; gap: 0.6rem; }

  .sheet {
    display: flex;
    flex-direction: column;
    position: fixed;
    left: 0;
    right: 0;
    top: 0;
    height: 100dvh;
    z-index: 30;
    background: var(--panel-solid);
    border-top: 1px solid var(--panel-edge);
    border-radius: 1.1rem 1.1rem 0 0;
    box-shadow: 0 -18px 44px -22px rgb(0 0 0 / 0.6);
    /* Where it sits before app.js has placed it. From then on the transform is
       set inline, on the element, rather than through a variable — see
       placeSheet for why that is not a detail. */
    transform: translateY(55dvh);
    will-change: transform;
  }
  .sheet[data-gliding='true'] {
    transition: transform 260ms cubic-bezier(0.32, 0.72, 0, 1);
  }

  /* The whole strip is the handle, not just the bar drawn in it — a 6px
     target is a miss on a moving train. */
  .sheet-grip {
    display: block;
    flex: none;
    width: 100%;
    padding: 0.65rem 0 0.5rem;
    background: none;
    border: 0;
    cursor: grab;
    touch-action: none;
  }
  .sheet-grip > span {
    display: block;
    width: 2.4rem;
    height: 0.28rem;
    margin: 0 auto;
    border-radius: 999px;
    background: var(--panel-edge);
  }
  .sheet-grip:active { cursor: grabbing; }

  .sheet-scroll {
    display: block;
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
  }
  /* Scrollable at every height, not only the tallest. Locking it below full
     meant an itinerary at half was a picture of an itinerary: the sheet had
     the press and would not move, and the list could not scroll either. */

  /* The sheet already does this, with three positions instead of two and a
     handle you can drag. Two collapse controls in the same corner is one too
     many, and the wrong one would win. */
  .fold { display: none; }

  .controls {
    position: static;
    z-index: auto;
    width: auto;
    max-width: none;
    border: 0;
    border-radius: 0;
    box-shadow: none;
    background: none;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    padding: 0 1rem 0.9rem;
  }
  .row.tight .field { flex: 1 1 7.5rem; }

  .panel {
    position: static;
    z-index: auto;
    width: auto;
    height: auto;
    /* Not a scroll container here. It is one on a wide screen, where it is the
     * right-hand column and scrolls itself — but inside the sheet it becomes a
     * scroller nested in a scroller, with nothing to scroll because its height
     * is its content. Chromium still aims the gesture at it, and the itinerary
     * is immovable: every touch landing on the panel is swallowed by a
     * container that cannot answer it. Touches above it, on the search
     * controls, scrolled the sheet perfectly well — which is exactly how it
     * looked, and why it read as the itinerary being frozen. */
    overflow: visible;
    padding: 0.4rem 1.15rem calc(3rem + env(safe-area-inset-bottom));
    border-left: none;
    border-top: 1px solid var(--panel-edge);
    box-shadow: none;
    background: none;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
}

@media (max-width: 34rem) {
  .controls { padding: 0 0.85rem 0.8rem; gap: 0.7rem; }
  .row { flex-wrap: wrap; }
  .toggle-text em { display: none; }
  .legend { font-size: 0.72rem; }
  .btn-ghost { font-size: 0.72rem; padding: 0.35rem 0.55rem; }
  .brandtext { font-size: 0.95rem; letter-spacing: 0.1em; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  .corridor:hover { transform: none; }
}

.where .via {
  display: block;
  margin-top: 0.1rem;
  font-family: var(--mono);
  font-size: 0.72rem;
  letter-spacing: 0.02em;
  color: var(--muted);
}

/* ------------------------------------------------- operators and booking */

/* Our own mark in the operator's livery, not their logo. It carries its own
   ink colour so it stays legible on either ground. */
.plate {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 2.15rem;
  padding: 0.06rem 0.3rem;
  background: var(--livery);
  color: var(--plate-ink);
  border-radius: var(--r-xs);
  font-family: var(--sans);
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.05em;
  line-height: 1.35;
  vertical-align: 0.05rem;
  flex: none;
}

.opline {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.35rem;
  margin-top: 0.3rem;
}
.opline .op-name {
  font-family: var(--sans);
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--ink-soft);
}
.opline .tag { margin-top: 0; }

/* This repeated on every leg at near-body size over two lines, so on an
   eight-leg route it was the loudest recurring element after the station
   names. It is a utility link and should read as one. */
.book-leg {
  display: inline-flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 0 0.4rem;
  margin-top: 0.45rem;
  font-family: var(--sans);
  font-size: 0.79rem;
  font-weight: 600;
  color: var(--rail);
  text-decoration: none;
}
.book-leg:hover { text-decoration: underline; text-underline-offset: 3px; }
.book-leg .host {
  font-family: var(--mono);
  font-size: 0.68rem;
  font-weight: 400;
  letter-spacing: 0.01em;
  color: var(--muted);
  opacity: 0.8;
}
.book-leg .host::before { content: '· '; }
/* No direct site, or nothing to book — say so rather than showing a dead link. */
.book-leg.none,
.book-leg.via {
  font-weight: 500;
  color: var(--muted);
}
.book-leg.via a { color: var(--rail); font-weight: 600; }

.booking li.divider {
  display: block;
  padding: 1.1rem 0 0.2rem;
  border-bottom: none;
}
.booking li.divider p {
  margin: 0;
  font-family: var(--sans);
  font-size: 0.82rem;
  font-weight: 600;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--muted);
}
.booking li.other .rank { color: var(--muted); }
.booking h3 {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.4rem;
}
.booking .book-leg { margin-top: 0.5rem; }

.disclosure {
  margin-top: 1rem;
  padding: 0.75rem 0.9rem;
  background: var(--raise);
  border: 1px solid var(--panel-edge);
  border-radius: var(--r);
  font-size: 0.86rem;
}
.disclosure b { font-family: var(--sans); color: var(--ink-soft); }

/* ------------------------------------------------------- ask, in sentences */

.ask { display: flex; flex-direction: column; gap: 0.4rem; }

.ask-row { display: flex; gap: 0.4rem; }
.ask-row input { flex: 1 1 auto; min-width: 0; }

.ask-go {
  flex: none;
  padding: 0 1.15rem;
  font-family: var(--sans);
  font-size: 0.9rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--sea);
  background: linear-gradient(
    180deg,
    color-mix(in srgb, var(--rail) 92%, #fff) 0%,
    var(--rail) 100%
  );
  border: 1px solid color-mix(in srgb, var(--rail) 80%, #000);
  border-radius: var(--r-sm);
  box-shadow: var(--lift-2);
  cursor: pointer;
  transition: filter 0.15s ease, transform 0.12s ease, box-shadow 0.15s ease;
}
.ask-go:hover {
  filter: brightness(1.06);
  box-shadow: var(--lift-2), 0 0 0 4px color-mix(in srgb, var(--rail) 18%, transparent);
}
.ask-go:active { transform: translateY(1px); box-shadow: var(--lift-1); }

/* How often the thing runs. Sits under the service name, quieter than the
   service but louder than a note, because on a once-a-day boat it is the most
   important fact on the row. */
.freq {
  display: block;
  margin-top: 0.2rem;
  font-family: var(--sans);
  font-size: 0.78rem;
  line-height: 1.4;
  color: var(--muted);
}
.freq b { color: var(--ink-soft); font-weight: 600; }
.freq.none { font-style: italic; opacity: 0.75; }
.freq .last {
  color: var(--alert);
  font-weight: 600;
  white-space: nowrap;
}

/* Day by day. A shape for the journey, not a timetable. */
.days { display: grid; gap: 0.5rem; }
.day {
  padding: 0.75rem 0.85rem;
  background: var(--raise);
  border: 1px solid var(--panel-edge);
  border-radius: var(--r);
  box-shadow: var(--lift-1), var(--sheen);
}
.day-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.6rem;
  margin-bottom: 0.35rem;
}
.day-n {
  font-family: var(--sans);
  font-size: 0.74rem;
  font-weight: 600;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--rail);
}
.day-hours {
  font-family: var(--mono);
  font-size: 0.74rem;
  color: var(--muted);
}
.day-legs { margin: 0; padding: 0; list-style: none; }
.day-legs li {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: baseline;
  gap: 0.4rem;
  padding: 0.25rem 0;
  font-family: var(--sans);
  font-size: 0.85rem;
  color: var(--ink-soft);
}
.day-legs li .mode-dot { align-self: center; }
.day-legs b { color: var(--ink); font-weight: 600; }
.day-legs .arrow { color: var(--muted); }
.day-legs .d-svc {
  display: block;
  font-size: 0.76rem;
  color: var(--muted);
}
.day-legs .d-time {
  font-family: var(--mono);
  font-size: 0.78rem;
  color: var(--muted);
  white-space: nowrap;
}
.night {
  display: inline-block;
  margin-top: 0.4rem;
  font-family: var(--sans);
  font-size: 0.78rem;
  color: var(--muted);
}
.night.sleeper { color: var(--rail); }
.night.end { color: var(--ink-soft); font-weight: 600; }

/* Where you sleep, and what it costs there rather than on average. */
.stays { margin: 0; padding: 0; list-style: none; display: grid; gap: 0.5rem; }
.stays > li {
  padding: 0.75rem 0.85rem;
  background: var(--raise);
  border: 1px solid var(--panel-edge);
  border-radius: var(--r);
  box-shadow: var(--lift-1), var(--sheen);
}
.stay-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.6rem;
}
.stay-city { font-family: var(--sans); font-size: 0.95rem; color: var(--ink-soft); }
.stay-city b { color: var(--ink); font-weight: 600; }
.stay-day {
  font-size: 0.74rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}
.stay-price {
  font-family: var(--mono);
  font-size: 1rem;
  font-weight: 600;
  color: var(--rail);
  white-space: nowrap;
}
.bands {
  display: flex;
  flex-wrap: wrap;
  gap: 0.3rem;
  margin-top: 0.4rem;
}
.band {
  display: flex;
  align-items: baseline;
  gap: 0.3rem;
  padding: 0.15rem 0.4rem;
  font-family: var(--sans);
  font-size: 0.76rem;
  color: var(--muted);
  border: 1px solid var(--panel-edge);
  border-radius: var(--r-xs);
}
.band b { font-family: var(--mono); font-weight: 600; color: var(--ink-soft); }
.band.on { border-color: var(--rail); color: var(--ink-soft); }
.band.on b { color: var(--rail); }
.stay-note {
  margin: 0.45rem 0 0;
  font-size: 0.85rem;
  line-height: 1.5;
  color: var(--muted);
}

/* What it decided, shown rather than assumed — including the road gap it
   cannot cover, which is the part that would otherwise be a nasty surprise. */
.ask-note {
  margin: 0;
  padding: 0.6rem 0.7rem;
  font-family: var(--sans);
  font-size: 0.84rem;
  line-height: 1.45;
  background: var(--raise);
  border-left: 2px solid var(--panel-edge);
  border-radius: var(--r);
  color: var(--muted);
}
.ask-note b { color: var(--ink); font-weight: 600; }
.ask-note.ok { border-left-color: var(--rail); }
.ask-note.warn { border-left-color: var(--alert); color: var(--ink-soft); }

/* "Did you mean" options. Buttons, because the note is asking a question and
   the answer should be one click rather than a retype. */
.ask-sug {
  display: inline-block;
  margin: 0.35rem 0.3rem 0 0;
  padding: 0.2rem 0.5rem;
  font: inherit;
  font-weight: 600;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--panel-edge);
  border-radius: var(--r-xs);
  cursor: pointer;
  transition: border-color 0.12s, color 0.12s;
}
.ask-sug:hover,
.ask-sug:focus-visible { border-color: var(--rail); color: var(--rail); }

.or {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  margin: 0;
  font-family: var(--sans);
  font-size: 0.82rem;
  font-weight: 500;
  letter-spacing: 0.01em;
  color: var(--muted);
  opacity: 0.85;
}
.or::before,
.or::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--panel-edge);
}

/* ------------------------------------------------------------ destinations */

/* Original illustrations rather than photographs — see src/scene.js for why. */
/* Was a 4.6rem letterbox through the middle of every image, which beheaded
   skylines and mountains alike and left cards looking like they were showing
   the wrong part of the picture. */
.corridor-art {
  display: block;
  margin: -0.95rem -1.05rem 0.85rem;
  height: 7.5rem;
  overflow: hidden;
  position: relative;
}
.corridor-art canvas { display: block; width: 100%; height: 100%; }
/* Photographs of skylines and coastlines are mostly sky, and a blown-out sky is
   the brightest thing on a dark page — it butts against the chrome and glares.
   A scrim at the top settles it in, the way the bottom fade already does. */
.corridor-art::before,
.banner::before {
  content: '';
  position: absolute;
  inset: 0 0 auto 0;
  height: 45%;
  background: linear-gradient(
    color-mix(in srgb, var(--panel-solid) 55%, transparent),
    transparent
  );
  pointer-events: none;
  z-index: 1;
}

/* Fade the plate into the card so it sits in the layout rather than on it. */
.corridor-art::after {
  content: '';
  position: absolute;
  inset: auto 0 0 0;
  height: 55%;
  background: linear-gradient(transparent, color-mix(in srgb, var(--raise) 92%, transparent) 55%, var(--raise));
  pointer-events: none;
}

.banner {
  position: relative;
  margin: -2.2rem -2.1rem 1.6rem;
  height: 13rem;
  overflow: hidden;
}
.banner canvas { display: block; width: 100%; height: 100%; }
.banner::after {
  content: '';
  position: absolute;
  inset: auto 0 0 0;
  height: 58%;
  background: linear-gradient(transparent, color-mix(in srgb, var(--panel-solid) 88%, transparent) 50%, var(--panel-solid));
  pointer-events: none;
}
.banner-cap {
  position: absolute;
  left: 1.9rem;
  bottom: 0.6rem;
  z-index: 1;
  font-family: var(--sans);
  font-size: 0.74rem;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink);
  text-shadow: 0 1px 6px rgb(0 0 0 / 0.5);
}

@media (max-width: 60rem) {
  .banner { margin: -1.5rem -1.25rem 1.2rem; height: 10rem; }
  .banner-cap { left: 1.25rem; }
}

/* ------------------------------------------------------------ photographs */

.photo {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  /* Above centre. Almost every photograph here is a landscape or a building,
     and the subject sits in the upper half — dead-centre cropping cut the tops
     off skylines and left a card full of foreground. */
  object-position: center 38%;
  /* Settle the image into the page's palette so photographs and drawn
     illustrations can sit side by side without one looking pasted in. */
  filter: saturate(0.9) contrast(1.03);
}

/* The credit the licence requires, kept on the image rather than only in a
   list at the bottom where nobody connects it to the picture.
   It used to be a hard black chip in the top-right corner of every photograph,
   which fought the title for attention and was the first thing the eye landed
   on. Bottom-right, over the fade that is already there, it stays legible and
   stops competing. */
.photo-credit {
  position: absolute;
  right: 0;
  bottom: 0.5rem;
  z-index: 2;
  max-width: 80%;
  padding: 0.12rem 0.6rem 0.12rem 1.6rem;
  font-family: var(--sans);
  font-size: 0.66rem;
  font-weight: 500;
  letter-spacing: 0.03em;
  line-height: 1.4;
  /* Always light on a dark fade, whatever the theme and whatever is in the
     photograph. A blown-out sky in light mode made a white credit vanish
     entirely, and this text is a licence condition, not decoration — it has to
     be readable on every image the fetcher might bring back. */
  color: rgb(255 255 255 / 0.88);
  background: linear-gradient(to left, rgb(6 14 18 / 0.62), rgb(6 14 18 / 0));
  text-shadow: 0 1px 3px rgb(0 0 0 / 0.9);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.credits {
  margin-top: 2rem;
  padding-top: 1rem;
  border-top: 1px solid var(--panel-edge);
}
.credits h3 {
  font-size: 0.8rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.credits ul { margin: 0.6rem 0 0; padding-left: 1rem; }
.credits li {
  margin-top: 0.3rem;
  font-size: 0.82rem;
  line-height: 1.5;
  color: var(--muted);
}
.credits b { font-family: var(--sans); font-weight: 600; color: var(--ink-soft); }
</style>
<script defer src="app.js"></script>
</body>
