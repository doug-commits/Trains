<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overland SEA — rail-first Southeast Asia planner</title>
<meta name="description" content="Plan a Southeast Asian journey that stays on rails as far as the rails go, bridges the gaps by sea, and tells you what happens at every border.">
</head>
<body>
<div class="app">
    <form class="controls" onsubmit="return false">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <span class="brandtext">Overland<b>SEA</b></span>
      </div>

      <div class="row">
        <label class="field">
          <span>From</span>
          <select id="from"></select>
        </label>
        <button type="button" id="swap" class="swap" title="Swap origin and destination" aria-label="Swap origin and destination">⇅</button>
        <label class="field">
          <span>To</span>
          <select id="to"></select>
        </label>
      </div>

      <div class="row tight">
        <label class="field">
          <span>Departing</span>
          <input type="date" id="date">
        </label>
        <label class="field">
          <span>Passport</span>
          <input type="text" id="nationality" placeholder="e.g. British" autocomplete="country-name">
        </label>
        <label class="field">
          <span>Pace</span>
          <select id="pace">
            <option value="relaxed">Relaxed</option>
            <option value="standard">Standard</option>
            <option value="fast">Hard running</option>
          </select>
        </label>
      </div>

      <label class="toggle">
        <input type="checkbox" id="railonly">
        <span class="track" aria-hidden="true"><span class="knob"></span></span>
        <span class="toggle-text">
          <b>Hard rail-only</b>
          <em>Refuse substitute road legs. Station transfers and pier shuttles stay — excluding those wouldn't route around a gap, it would just make the journey impossible.</em>
        </span>
      </label>
    </form>

  <div class="mapwrap">
    <canvas id="map" aria-label="Map of the Southeast Asian rail, sea and road network"></canvas>
    <div id="tip" class="tip" role="status" hidden></div>

    <div class="mapfoot">
      <div class="legend">
        <span class="key"><i class="line rail"></i>Rail</span>
        <span class="key"><i class="line ferry"></i>Sea</span>
        <span class="key"><i class="line road"></i>Road</span>
        <span class="key"><i class="bmark"></i>Border</span>
      </div>
      <button type="button" id="reset" class="ghost">Reset view</button>
    </div>
  </div>

  <aside id="panel" class="panel" aria-live="polite"></aside>
</div>

/* Overland SEA — a chart console.
 *
 * The map is the ground and the itinerary is a document laid over it, so the
 * palette comes from marine charts rather than from transit apps: deep petrol
 * water, warm land, and a marigold that belongs to this region for the rails.
 *
 * Modes carry both hue and line style, and risk severity is encoded in form as
 * well as colour, so nothing here depends on hue alone.
 */

:root {
  color-scheme: dark;

  --sea: #0a191f;
  --land: #1b3138;
  --land-edge: #2c4f5a;
  --panel: #0d2028;
  --panel-solid: #0d2028;
  --panel-edge: #21414c;
  --raise: #122a33;

  --ink: #e7efea;
  --ink-soft: #c4d6d5;
  --muted: #7d9ba2;

  --rail: #e9a63e;
  --ferry: #57b6c8;
  --road: #978d7f;
  --alert: #e2615a;

  --idle-line: #2b4d58;
  --idle-dot: #3b626d;

  --panel-w: 28.5rem;
  --radius: 3px;

  --sans: BarlowCond, ui-sans-serif, system-ui, sans-serif;
  --serif: Spectral, Georgia, serif;
  --mono: PlexMono, ui-monospace, SFMono-Regular, monospace;
}

@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --sea: #d7e3e5;
    --land: #f4f2eb;
    --land-edge: #d9d4c6;
    --panel: #fbfaf6;
    --panel-solid: #fbfaf6;
    --panel-edge: #ddd8ca;
    --raise: #efece3;

    --ink: #13212a;
    --ink-soft: #2c3d45;
    --muted: #5b7178;

    --rail: #a96a08;
    --ferry: #1f7c92;
    --road: #7b7263;
    --alert: #b93a2e;

    --idle-line: #c2c9c4;
    --idle-dot: #a9b4b2;
  }
}

/* The viewer's own toggle stamps data-theme and must win over the media query
   in both directions. */
:root[data-theme='dark'] {
  color-scheme: dark;
  --sea: #0a191f; --land: #1b3138; --land-edge: #2c4f5a;
  --panel: #0d2028; --panel-solid: #0d2028; --panel-edge: #21414c; --raise: #122a33;
  --ink: #e7efea; --ink-soft: #c4d6d5; --muted: #7d9ba2;
  --rail: #e9a63e; --ferry: #57b6c8; --road: #978d7f; --alert: #e2615a;
  --idle-line: #2b4d58; --idle-dot: #3b626d;
}

:root[data-theme='light'] {
  color-scheme: light;
  --sea: #d7e3e5; --land: #f4f2eb; --land-edge: #d9d4c6;
  --panel: #fbfaf6; --panel-solid: #fbfaf6; --panel-edge: #ddd8ca; --raise: #efece3;
  --ink: #13212a; --ink-soft: #2c3d45; --muted: #5b7178;
  --rail: #a96a08; --ferry: #1f7c92; --road: #7b7263; --alert: #b93a2e;
  --idle-line: #c2c9c4; --idle-dot: #a9b4b2;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--sea);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

:focus-visible {
  outline: 2px solid var(--rail);
  outline-offset: 2px;
}

/* ------------------------------------------------------------------ frame */

.app {
  position: relative;
  height: 100dvh;
  overflow: hidden;
}

.mapwrap { position: absolute; inset: 0; }

#map {
  display: block;
  width: 100%;
  height: 100%;
  cursor: grab;
  touch-action: none;
}

/* ------------------------------------------------------------- controls */

.controls {
  position: absolute;
  top: 1.25rem;
  left: 1.25rem;
  width: 23rem;
  max-width: calc(100vw - 2.5rem);
  padding: 1rem 1.1rem 1.1rem;
  display: flex;
  flex-direction: column;
  gap: 0.85rem;
  background: color-mix(in srgb, var(--panel) 88%, transparent);
  backdrop-filter: blur(14px) saturate(1.3);
  -webkit-backdrop-filter: blur(14px) saturate(1.3);
  border: 1px solid var(--panel-edge);
  border-radius: var(--radius);
  box-shadow: 0 16px 40px -20px rgb(0 0 0 / 0.55);
  z-index: 3;
}

.brand {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  font-family: var(--sans);
}

.brand .mark {
  width: 1.5rem;
  height: 0.55rem;
  flex: none;
  background:
    linear-gradient(var(--rail), var(--rail)) left center / 100% 2.5px no-repeat,
    repeating-linear-gradient(90deg, var(--muted) 0 1.5px, transparent 1.5px 5px) center / 100% 100%;
}

.brandtext {
  font-size: 1.05rem;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.brandtext b { color: var(--ink); font-weight: 600; }

.row {
  display: flex;
  align-items: flex-end;
  gap: 0.5rem;
}
.row.tight { gap: 0.4rem; }
.row .field { flex: 1 1 0; min-width: 0; }

.field { display: flex; flex-direction: column; gap: 0.22rem; }

.field > span {
  font-family: var(--sans);
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--muted);
}

.field select,
.field input {
  width: 100%;
  min-width: 0;
  padding: 0.42rem 0.5rem;
  font-family: var(--sans);
  font-size: 0.95rem;
  font-weight: 500;
  color: var(--ink);
  background: var(--raise);
  border: 1px solid var(--panel-edge);
  border-radius: 2px;
}
.field select:hover,
.field input:hover { border-color: var(--muted); }

.swap {
  flex: none;
  width: 2rem;
  height: 2rem;
  margin-bottom: 0.05rem;
  font-size: 1rem;
  color: var(--muted);
  background: var(--raise);
  border: 1px solid var(--panel-edge);
  border-radius: 2px;
  cursor: pointer;
}
.swap:hover { color: var(--rail); border-color: var(--rail); }

.toggle {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 0.6rem;
  align-items: start;
  cursor: pointer;
  padding-top: 0.8rem;
  border-top: 1px solid var(--panel-edge);
}
/* Visually hidden but still focusable and hit-testable — a zero-size box gets
   skipped by some assistive tech and by automation. */
.toggle > input {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  border: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.toggle .track {
  width: 2.15rem;
  height: 1.15rem;
  margin-top: 0.1rem;
  background: var(--raise);
  border: 1px solid var(--panel-edge);
  border-radius: 1rem;
  position: relative;
  transition: background 0.16s ease, border-color 0.16s ease;
}
.toggle .knob {
  position: absolute;
  top: 0.125rem;
  left: 0.15rem;
  width: 0.8rem;
  height: 0.8rem;
  border-radius: 50%;
  background: var(--muted);
  transition: transform 0.16s ease, background 0.16s ease;
}
.toggle > input:checked + .track { border-color: var(--rail); }
.toggle > input:checked + .track .knob { transform: translateX(0.95rem); background: var(--rail); }
.toggle > input:focus-visible + .track { outline: 2px solid var(--rail); outline-offset: 2px; }

.toggle-text { font-family: var(--sans); line-height: 1.35; }
.toggle-text b { display: block; font-size: 0.95rem; font-weight: 600; }
.toggle-text em {
  display: block;
  margin-top: 0.15rem;
  font-style: normal;
  font-size: 0.8rem;
  color: var(--muted);
}

/* --------------------------------------------------------------- mapfoot */

.mapfoot {
  position: absolute;
  left: 1.25rem;
  bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  z-index: 3;
}

.legend {
  display: flex;
  gap: 0.85rem;
  padding: 0.4rem 0.7rem;
  background: color-mix(in srgb, var(--panel) 85%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--panel-edge);
  border-radius: var(--radius);
  font-family: var(--sans);
  font-size: 0.8rem;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}
.key { display: flex; align-items: center; gap: 0.35rem; }
.line { width: 1.4rem; height: 0; border-top-width: 2.5px; }
.line.rail { border-top: 2.5px solid var(--rail); }
.line.ferry { border-top: 2.5px dashed var(--ferry); }
.line.road { border-top: 2.5px dotted var(--road); }
.bmark {
  width: 0.5rem; height: 0.5rem;
  background: var(--alert);
  transform: rotate(45deg);
}

.ghost {
  padding: 0.4rem 0.7rem;
  font-family: var(--sans);
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--muted);
  background: color-mix(in srgb, var(--panel) 85%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--panel-edge);
  border-radius: var(--radius);
  cursor: pointer;
}
.ghost:hover { color: var(--ink); border-color: var(--muted); }

/* ------------------------------------------------------------------- tip */

.tip {
  position: absolute;
  z-index: 4;
  max-width: 17rem;
  padding: 0.45rem 0.6rem;
  pointer-events: none;
  background: var(--panel-solid);
  border: 1px solid var(--panel-edge);
  border-radius: 2px;
  box-shadow: 0 10px 24px -14px rgb(0 0 0 / 0.6);
  font-family: var(--sans);
  line-height: 1.35;
}
.tip b { display: block; font-size: 0.95rem; font-weight: 600; }
.tip span { display: block; font-size: 0.82rem; color: var(--muted); }
.tip em {
  display: block;
  margin-top: 0.3rem;
  padding-top: 0.3rem;
  border-top: 1px solid var(--panel-edge);
  font-style: normal;
  font-size: 0.8rem;
  color: var(--alert);
}

/* ----------------------------------------------------------------- panel */

.panel {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: var(--panel-w);
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 1.9rem 1.9rem 4rem;
  z-index: 2;
  background: color-mix(in srgb, var(--panel) 93%, transparent);
  backdrop-filter: blur(18px) saturate(1.2);
  -webkit-backdrop-filter: blur(18px) saturate(1.2);
  border-left: 1px solid var(--panel-edge);
  box-shadow: -20px 0 50px -30px rgb(0 0 0 / 0.6);
}

/* --------------------------------------------------------------- heading */

.head { margin-bottom: 1.6rem; }

.eyebrow {
  margin: 0 0 0.7rem;
  font-family: var(--mono);
  font-size: 0.7rem;
  font-weight: 400;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}

.panel h1 {
  margin: 0 0 1rem;
  font-family: var(--sans);
  font-size: clamp(1.9rem, 3.4vw, 2.5rem);
  font-weight: 600;
  line-height: 1.02;
  letter-spacing: -0.005em;
  text-wrap: balance;
}
.panel h1 span { color: var(--rail); font-weight: 500; }

.lede {
  margin: 0;
  font-size: 1.02rem;
  line-height: 1.62;
  color: var(--ink-soft);
  max-width: 34em;
}

.sub {
  margin: 0.6rem 0 0;
  font-size: 0.92rem;
  line-height: 1.55;
  color: var(--muted);
  max-width: 36em;
}
.sub.foot { margin-top: 1.1rem; }

/* ----------------------------------------------------------------- stats */

.stats {
  display: flex;
  flex-wrap: wrap;
  gap: 0 1.35rem;
  margin: 0 0 1.1rem;
  padding: 0.75rem 0;
  border-top: 1px solid var(--panel-edge);
  border-bottom: 1px solid var(--panel-edge);
}
.stat { display: flex; align-items: baseline; gap: 0.32rem; }
.stat b {
  font-family: var(--mono);
  font-size: 1.02rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.stat span {
  font-family: var(--sans);
  font-size: 0.78rem;
  font-weight: 500;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--muted);
}

/* --------------------------------------------------------------- blocks */

.block { margin-top: 2.2rem; }

.panel h2 {
  margin: 0;
  padding-bottom: 0.45rem;
  border-bottom: 2px solid var(--rail);
  font-family: var(--sans);
  font-size: 0.88rem;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink);
}

.panel h3 {
  margin: 0;
  font-family: var(--sans);
  font-size: 1.06rem;
  font-weight: 600;
  line-height: 1.25;
  text-wrap: balance;
}

.panel p { margin: 0.5rem 0 0; }
.panel a { color: var(--rail); text-underline-offset: 2px; }

/* -------------------------------------------------------------- callouts */

.callout {
  margin-top: 1.2rem;
  padding: 0.85rem 1rem;
  background: var(--raise);
  border: 1px solid var(--panel-edge);
  border-radius: var(--radius);
}
.callout.alert {
  border-color: color-mix(in srgb, var(--alert) 55%, var(--panel-edge));
  background: color-mix(in srgb, var(--alert) 9%, var(--raise));
}
.callout h3 { font-size: 0.98rem; }
.callout p { font-size: 0.93rem; color: var(--ink-soft); }

.warns { margin: 0.5rem 0 0; padding-left: 1rem; }
.warns li { font-size: 0.92rem; color: var(--ink-soft); margin-top: 0.35rem; }
.warns b { font-family: var(--sans); font-weight: 600; }

/* ----------------------------------------------------------- route table */

.table-wrap { overflow-x: auto; margin-top: 0.9rem; }

table { width: 100%; border-collapse: collapse; }

.route thead th {
  padding: 0 0.4rem 0.4rem;
  text-align: left;
  font-family: var(--sans);
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--muted);
  border-bottom: 1px solid var(--panel-edge);
}
.num-col { text-align: right; }

.route tr.leg { cursor: default; }
.route tr.leg > td {
  padding: 0.62rem 0.4rem;
  vertical-align: top;
  border-bottom: 1px solid color-mix(in srgb, var(--panel-edge) 60%, transparent);
}
.route tr.leg:hover > td,
.route tr.leg:focus-visible > td { background: var(--raise); }

.route .num {
  width: 2.2rem;
  font-family: var(--mono);
  font-size: 0.82rem;
  color: var(--muted);
  white-space: nowrap;
}
.mode-dot {
  display: inline-block;
  width: 0.42rem;
  height: 0.42rem;
  margin-right: 0.4rem;
  vertical-align: 0.05rem;
  border-radius: 50%;
}
.mode-dot.rail { background: var(--rail); }
.mode-dot.ferry { background: var(--ferry); }
.mode-dot.road { background: var(--road); }

.where { font-family: var(--sans); line-height: 1.3; }
.where b { font-size: 0.98rem; font-weight: 600; }
.where .arrow { color: var(--rail); margin: 0 0.3rem; }
.where .svc {
  display: block;
  margin-top: 0.12rem;
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--muted);
}
.where .cls {
  margin-left: 0.4rem;
  padding-left: 0.4rem;
  border-left: 1px solid var(--panel-edge);
}
.where .leg-note {
  display: block;
  margin-top: 0.35rem;
  font-family: var(--serif);
  font-size: 0.88rem;
  line-height: 1.5;
  color: var(--ink-soft);
}

.op { white-space: nowrap; }
.op-name {
  display: block;
  font-family: var(--sans);
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--ink-soft);
}
.tag {
  display: inline-block;
  margin-top: 0.2rem;
  padding: 0.02rem 0.3rem;
  font-family: var(--mono);
  font-size: 0.64rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  border: 1px solid currentColor;
  border-radius: 2px;
  color: var(--muted);
}
.tag.warn { color: var(--alert); }

.dur, .fare {
  font-family: var(--mono);
  font-size: 0.85rem;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.fare { color: var(--muted); }

.route tr.junction > td {
  padding: 0.3rem 0.4rem 0.55rem;
  font-family: var(--sans);
  font-size: 0.82rem;
  border-bottom: 1px solid color-mix(in srgb, var(--panel-edge) 60%, transparent);
}
.j-label { font-weight: 600; color: var(--muted); }
.j-buffer {
  margin-left: 0.45rem;
  padding: 0.02rem 0.32rem;
  font-family: var(--mono);
  font-size: 0.74rem;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  background: var(--raise);
  border: 1px solid var(--panel-edge);
  border-radius: 2px;
}
.j-rule { display: block; margin-top: 0.15rem; color: var(--muted); }
.route tr.junction.warn .j-buffer {
  color: var(--alert);
  border-color: color-mix(in srgb, var(--alert) 50%, var(--panel-edge));
}

/* --------------------------------------------------------------- borders */

.crossing {
  margin-top: 1.4rem;
  padding-top: 1.1rem;
  border-top: 1px solid var(--panel-edge);
}
.crossing.hard { border-top-color: var(--alert); border-top-width: 2px; }

.crossing header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.75rem;
  flex-wrap: wrap;
}
.crossing .countries {
  font-family: var(--mono);
  font-size: 0.72rem;
  letter-spacing: 0.05em;
  color: var(--muted);
  white-space: nowrap;
}

.crossing dl {
  display: grid;
  grid-template-columns: minmax(6.5rem, auto) 1fr;
  gap: 0.32rem 0.9rem;
  margin: 0.8rem 0 0;
}
.crossing dt {
  font-family: var(--sans);
  font-size: 0.76rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  padding-top: 0.12rem;
}
.crossing dd {
  margin: 0;
  font-size: 0.93rem;
  line-height: 1.5;
  color: var(--ink-soft);
}

.trap {
  margin-top: 0.85rem !important;
  padding: 0.7rem 0.85rem;
  font-size: 0.93rem;
  line-height: 1.55;
  background: var(--raise);
  border-radius: var(--radius);
}
.trap b {
  font-family: var(--sans);
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--alert);
}
.trap.verify b { color: var(--ferry); }

/* ----------------------------------------------------------------- risks */

.risks { margin: 0; padding: 0; list-style: none; }

.risk {
  padding: 1.1rem 0;
  border-bottom: 1px solid var(--panel-edge);
}
.risk:first-child { padding-top: 1.2rem; }

.sev {
  display: inline-block;
  margin-bottom: 0.4rem;
  padding: 0.06rem 0.4rem;
  font-family: var(--mono);
  font-size: 0.64rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  border-radius: 2px;
}
/* Severity reads through fill weight as well as hue. */
.risk.critical .sev { color: var(--sea); background: var(--alert); }
.risk.caution .sev { color: var(--alert); border: 1px solid var(--alert); }
.risk.note .sev { color: var(--ferry); border: 1px solid var(--ferry); }

.risk p { font-size: 0.95rem; color: var(--ink-soft); }
.risk .fix { color: var(--muted); }
.risk .fix b {
  font-family: var(--sans);
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--ink-soft);
}

/* --------------------------------------------------------------- booking */

.booking { margin: 0; padding: 0; list-style: none; counter-reset: none; }
.booking li {
  display: grid;
  grid-template-columns: 1.9rem 1fr;
  gap: 0.75rem;
  padding: 1rem 0;
  border-bottom: 1px solid var(--panel-edge);
}
.booking .rank {
  font-family: var(--mono);
  font-size: 1.15rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--rail);
  line-height: 1.15;
}
.booking .window {
  font-family: var(--sans);
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--muted);
  margin-top: 0.15rem !important;
}
.booking p { font-size: 0.93rem; color: var(--ink-soft); }

.book {
  display: inline-block;
  margin-top: 0.5rem;
  font-family: var(--mono);
  font-size: 0.78rem;
  color: var(--rail);
}
.book.none { color: var(--muted); }

/* ----------------------------------------------------------------- costs */

.costs td {
  padding: 0.42rem 0;
  font-size: 0.94rem;
  border-bottom: 1px solid color-mix(in srgb, var(--panel-edge) 60%, transparent);
}
.costs .num-col {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.costs .saved td { color: var(--muted); font-size: 0.88rem; }
.costs .total td {
  padding-top: 0.6rem;
  font-family: var(--sans);
  font-size: 1.05rem;
  font-weight: 600;
  border-bottom: none;
  border-top: 1px solid var(--panel-edge);
}
.costs .total .num-col { font-family: var(--mono); color: var(--rail); }

.compare {
  margin-top: 1.3rem;
  padding: 0.9rem 1rem;
  background: var(--raise);
  border: 1px solid var(--panel-edge);
  border-radius: var(--radius);
}
.compare h3 { font-size: 0.82rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.compare p { font-size: 0.94rem; color: var(--ink-soft); }
.compare .honest { color: var(--muted); font-size: 0.91rem; }

/* --------------------------------------------------------------- detours */

.detours { margin: 0; padding: 0; list-style: none; }
.detours li { padding: 1rem 0; border-bottom: 1px solid var(--panel-edge); }
.detours .cost {
  display: inline-block;
  margin-top: 0.25rem;
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--rail);
}
.detours p { font-size: 0.94rem; color: var(--ink-soft); }

/* ------------------------------------------------------------ idle state */

.chips { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.9rem; }

.chip {
  display: block;
  width: 100%;
  padding: 0.6rem 0.75rem;
  text-align: left;
  font-family: var(--sans);
  color: var(--ink);
  background: var(--raise);
  border: 1px solid var(--panel-edge);
  border-radius: var(--radius);
  cursor: pointer;
  transition: border-color 0.14s ease, transform 0.14s ease;
}
.chip:hover { border-color: var(--rail); transform: translateX(2px); }
.chip b { display: block; font-size: 1rem; font-weight: 600; }
.chip span { display: block; font-size: 0.85rem; line-height: 1.35; color: var(--muted); }

.myths { margin: 0.9rem 0 0; padding: 0; list-style: none; }
.myths li { padding: 0.8rem 0; border-bottom: 1px solid var(--panel-edge); }
.myths .belief {
  display: block;
  font-family: var(--sans);
  font-size: 0.98rem;
  font-weight: 600;
  color: var(--muted);
}
.myths .belief::before { content: '“'; }
.myths .belief::after { content: '”'; }
.myths .reality {
  display: block;
  margin-top: 0.25rem;
  font-size: 0.94rem;
  line-height: 1.5;
  color: var(--ink-soft);
}

/* ------------------------------------------------------------- foot note */

.foot-note {
  margin-top: 2.4rem;
  padding-top: 1rem;
  border-top: 1px solid var(--panel-edge);
}
.foot-note p {
  margin: 0;
  font-size: 0.85rem;
  line-height: 1.55;
  color: var(--muted);
}

/* ------------------------------------------------------------ responsive */

/* Below the breakpoint the three panes stop overlapping and simply stack:
   controls, then a sticky map that stays in view while the itinerary scrolls
   past it, then the itinerary. */
@media (max-width: 60rem) {
  .app {
    display: flex;
    flex-direction: column;
    height: auto;
    min-height: 100dvh;
    overflow: visible;
  }

  .controls {
    position: static;
    z-index: 3;
    width: auto;
    max-width: none;
    border: 0;
    border-bottom: 1px solid var(--panel-edge);
    border-radius: 0;
    box-shadow: none;
    background: var(--panel-solid);
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
  .row.tight .field { flex: 1 1 7.5rem; }

  /* Flex items honour z-index even when position is static, so the panel's
     stacking value has to be lowered or it paints over the sticky map. */
  .mapwrap {
    position: sticky;
    inset: auto;
    top: 0;
    z-index: 2;
    flex: none;
    height: 42dvh;
    border-bottom: 1px solid var(--panel-edge);
    background: var(--sea);
  }

  .panel {
    position: static;
    z-index: 1;
    width: auto;
    height: auto;
    padding: 1.5rem 1.25rem 3rem;
    border-left: none;
    box-shadow: none;

/* Southeast Asian overland network — stations, legs, borders.
 *
 * This is the product. The routing code is twenty lines; the value is in the
 * accuracy of what follows, so every claim here is either structural (gauges,
 * which stations exist, who stamps where) or explicitly labelled as indicative.
 *
 * Durations are typical scheduled running times, NOT departure times. The app
 * never invents a departure time — the operators share no timetable and a
 * remembered departure is the fastest way to strand someone at Padang Besar.
 *
 * confidence:
 *   'structural' — physical/administrative fact, stable for years
 *   'reported'   — consistent across Seat61 / Barrow / operator pages
 *   'verify'     — volatile; the UI surfaces this as a warning
 *
 * Last reviewed against the network atlas: 2026-07.
 */

/* ===== src/proj.js ===== */
/* Web Mercator projection with a fitted, pannable, zoomable viewport.
 *
 * Mercator rather than equirectangular because the region spans 40 degrees of
 * latitude and the equirectangular squash makes Java look wrong next to Yunnan.
 */

const Proj = (() => {
  const DEG = Math.PI / 180

  /* Mercator y, expressed in the same degree units as longitude so a single
   * scale factor applies to both axes. Leaving y in radians while x is in
   * degrees squashes the map by a factor of 57. */
  function mercY(lat) {
    const clamped = Math.max(-85, Math.min(85, lat))
    return Math.log(Math.tan(Math.PI / 4 + (clamped * DEG) / 2)) / DEG
  }

  /* Mercator y grows northward; screen y grows downward. Negating once here
   * keeps scale positive everywhere else — the alternative is a negative scale
   * that silently mirrors the whole map. */
  const screenY = lat => -mercY(lat)
  const invScreenY = y => (2 * Math.atan(Math.exp(-y * DEG)) - Math.PI / 2) / DEG

  /** A view maps lon/lat to CSS pixels within a w x h box. */
  function create(bbox, w, h, padding = 0) {
    const x0 = bbox.west
    const x1 = bbox.east
    const y0 = screenY(bbox.north) // top
    const y1 = screenY(bbox.south) // bottom, and greater than y0

    const iw = Math.max(1, w - padding * 2)
    const ih = Math.max(1, h - padding * 2)
    const scale = Math.min(iw / (x1 - x0), ih / (y1 - y0))

    return {
      w,
      h,
      scale,
      // Centre the fitted content in the box.
      dx: padding + (iw - (x1 - x0) * scale) / 2 - x0 * scale,
      dy: padding + (ih - (y1 - y0) * scale) / 2 - y0 * scale,
      baseScale: scale,
    }
  }

  function project(view, lon, lat) {
    return {
      x: lon * view.scale + view.dx,
      y: screenY(lat) * view.scale + view.dy,
    }
  }

  function unproject(view, x, y) {
    return {
      lon: (x - view.dx) / view.scale,
      lat: invScreenY((y - view.dy) / view.scale),
    }
  }

  /** Zoom about a fixed screen point, so the pixel under the cursor stays put. */
  function zoomAt(view, x, y, factor, minZoom = 1, maxZoom = 14) {
    const target = view.scale * factor
    const lo = view.baseScale * minZoom
    const hi = view.baseScale * maxZoom
    const scale = Math.max(lo, Math.min(hi, target))
    const k = scale / view.scale
    return {
      ...view,
      scale,
      dx: x - (x - view.dx) * k,
      dy: y - (y - view.dy) * k,
    }
  }

  function pan(view, dx, dy) {
    return { ...view, dx: view.dx + dx, dy: view.dy + dy }
  }

  /** Fit a set of {lon,lat} points into the box, respecting a zoom ceiling. */
  function fitPoints(view, points, padding, maxZoom = 9) {
    if (!points.length) return view
    let west = Infinity
    let east = -Infinity
    let north = -Infinity
    let south = Infinity
    for (const p of points) {
      west = Math.min(west, p.lon)
      east = Math.max(east, p.lon)
      north = Math.max(north, p.lat)
      south = Math.min(south, p.lat)
    }
    // A single-point or near-degenerate extent would divide by ~zero.
    const padLon = Math.max(0.6, (east - west) * 0.08)
    const padLat = Math.max(0.6, (north - south) * 0.08)
    const box = {
      west: west - padLon,
      east: east + padLon,
      north: north + padLat,
      south: south - padLat,
    }
    const fitted = create(box, view.w, view.h, padding)
    const capped = Math.min(fitted.scale, view.baseScale * maxZoom)
    if (capped === fitted.scale) return { ...fitted, baseScale: view.baseScale }

    // Re-centre at the capped scale.
    const cx = (box.west + box.east) / 2
    const cy = (screenY(box.north) + screenY(box.south)) / 2
    return {
      ...view,
      scale: capped,
      dx: view.w / 2 - cx * capped,
      dy: view.h / 2 - cy * capped,
      baseScale: view.baseScale,
    }
  }

  /** Great-circle distance in km — used for the honest flight comparison. */
  function haversine(a, b) {
    const R = 6371
    const dLat = (b.lat - a.lat) * DEG
    const dLon = (b.lon - a.lon) * DEG
    const s =
      Math.sin(dLat / 2) ** 2 +
      Math.cos(a.lat * DEG) * Math.cos(b.lat * DEG) * Math.sin(dLon / 2) ** 2
    return 2 * R * Math.asin(Math.sqrt(s))
  }

  return { create, project, unproject, zoomAt, pan, fitPoints, haversine, screenY }
})()


/* ===== src/router.js ===== */
/* Rail-first routing.
 *
 * The graph is small enough that the algorithm is not the interesting part —
 * plain Dijkstra over ~90 edges. What matters is the cost function, because it
 * encodes the whole thesis of the product: stay on rails as far as the rails
 * go, take a boat where the land ends, and use a road vehicle only where
 * neither exists.
 *
 * A shortest-time router would answer half these queries with a bus. This one
 * charges road time at three and a half times its face value, so it will
 * happily spend an extra six hours on a train to avoid two on a coach.
 */

const Router = (() => {
  const MODE_WEIGHT = { rail: 1, ferry: 1.5, road: 3.5 }

  // Every leg carries a fixed penalty so the router doesn't assemble a chain of
  // ten short hops where one longer leg exists.
  const LEG_PENALTY = 0.5

  // Border formalities cost real hours and real risk, so they're weighted above
  // their clock time. Fewer frontiers is genuinely a better itinerary.
  const BORDER_WEIGHT = 1.5

  // The ferry-bridges design principle, made mechanical: when two routings are
  // close on time and cost, prefer the one with the better boat.
  const SCENIC_BONUS = 0.4

  function buildAdjacency(network, opts) {
    const adj = new Map()
    const add = (from, to, leg, reversed) => {
      if (!adj.has(from)) adj.set(from, [])
      adj.get(from).push({ to, leg, reversed })
    }

    for (const leg of network.legs) {
      if (opts.railOnly && leg.mode === 'road' && !leg.essential) continue
      if (opts.avoidAdvisory && leg.advisory) continue
      add(leg.from, leg.to, leg, false)
      add(leg.to, leg.from, leg, true)
    }
    return adj
  }

  function edgeCost(network, leg, opts) {
    let cost = leg.hours * (MODE_WEIGHT[leg.mode] ?? 1) + LEG_PENALTY

    if (leg.border) {
      const border = network.borders[leg.border]
      if (border) cost += ((border.minutes ?? 60) / 60) * BORDER_WEIGHT
    }
    if (leg.scenic && opts.preferScenic !== false) cost -= SCENIC_BONUS
    if (leg.confidence === 'verify') cost += 1.5 // prefer legs we can stand behind

    return Math.max(0.1, cost)
  }

  /**
   * @returns {{path: object[], stations: string[]} | null}
   *          path is an ordered list of {leg, from, to} in travel direction.
   */
  function route(network, fromId, toId, opts = {}) {
    if (fromId === toId) return null
    if (!network.stations[fromId] || !network.stations[toId]) return null

    const adj = buildAdjacency(network, opts)
    const dist = new Map([[fromId, 0]])
    const prev = new Map()
    const done = new Set()

    // A binary heap would be overkill at this size; linear scan is clearer.
    const queue = new Set([fromId])

    while (queue.size) {
      let current = null
      let best = Infinity
      for (const id of queue) {
        const d = dist.get(id) ?? Infinity
        if (d < best) {
          best = d
          current = id
        }
      }
      if (current === null) break
      queue.delete(current)
      done.add(current)
      if (current === toId) break

      for (const edge of adj.get(current) ?? []) {
        if (done.has(edge.to)) continue
        const next = best + edgeCost(network, edge.leg, opts)
        if (next < (dist.get(edge.to) ?? Infinity)) {
          dist.set(edge.to, next)
          prev.set(edge.to, { from: current, edge })
          queue.add(edge.to)
        }
      }
    }

    if (!prev.has(toId) && fromId !== toId) return null

    const path = []
    let cursor = toId
    while (cursor !== fromId) {
      const step = prev.get(cursor)
      if (!step) return null
      path.unshift({
        leg: step.edge.leg,
        from: step.from,
        to: cursor,
        reversed: step.edge.reversed,
      })
      cursor = step.from
    }

    return { path, stations: [fromId, ...path.map(s => s.to)] }
  }

  /** Which stations are reachable at all — used to explain a failed route. */
  function reachable(network, fromId, opts = {}) {
    const adj = buildAdjacency(network, opts)
    const seen = new Set([fromId])
    const stack = [fromId]
    while (stack.length) {
      const id = stack.pop()
      for (const edge of adj.get(id) ?? []) {
        if (!seen.has(edge.to)) {
          seen.add(edge.to)
          stack.push(edge.to)
        }
      }
    }
    return seen
  }

  return { route, reachable, MODE_WEIGHT }
})()
