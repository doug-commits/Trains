    const runs = []
    for (const step of path) {
      const leg = step.leg
      const open = runs[runs.length - 1]
      const sameVehicle =
        open && open.op === leg.op && open.mode === leg.mode && open.service === leg.service
      if (sameVehicle) open.steps.push(step)
      else runs.push({ op: leg.op, mode: leg.mode, service: leg.service, steps: [step] })
    }

    return runs.map(run => {
      const parts = run.steps.map(s => s.leg)
      const first = parts[0]
      const last = parts[parts.length - 1]
      const confidence = parts.some(l => l.confidence === 'verify')
        ? 'verify'
        : parts.some(l => l.confidence === 'reported')
          ? 'reported'
          : 'structural'

      return {
        mode: run.mode,
        op: run.op,
        service: run.service,
        // Round away binary-float noise; these are indicative times anyway.
        hours: Math.round(parts.reduce((n, l) => n + l.hours, 0) * 100) / 100,
        usd: Math.round(parts.reduce((n, l) => n + (l.usd ?? 0), 0) * 100) / 100,
        cls: parts.find(l => l.cls)?.cls,
        sleeper: parts.some(l => l.sleeper),
        scenic: parts.some(l => l.scenic),
        essential: parts.every(l => l.essential),
        advisory: parts.find(l => l.advisory)?.advisory,
        confidence,
        note: [...new Set(parts.map(l => l.note).filter(Boolean))].join(' '),
        borderIds: parts.map(l => l.border).filter(Boolean),
        // Only a frontier at the very start or end of a run governs the buffer
        // at that junction; one in the middle is crossed aboard the train.
        borderAtStart: first.border || null,
        borderAtEnd: last.border || null,
        steps: run.steps.map(s => ({ from: s.from, to: s.to, mode: run.mode, border: s.leg.border || null })),
      }
    })
  }

  /* ------------------------------------------------------------- buffers
   * Every junction gets the largest applicable minimum from the rulebook.
   * If the traveller's real gap is smaller than this, it is not a connection.
   */
  function bufferFor(network, prev, next) {
    const rules = []
    const prevLeg = prev.leg
    const nextLeg = next.leg

    // Call it a terminal when a boat is involved; "same station" reads wrong
    // at a pier and undermines trust in everything around it.
    const place =
      prevLeg.mode === 'ferry' || nextLeg.mode === 'ferry' ? 'terminal' : 'station'

    const shortTransfer = nextLeg.essential && nextLeg.mode === 'road' && nextLeg.hours <= 1

    rules.push(
      shortTransfer
        ? { minutes: 30, rule: 'Step off and walk to the connecting transport' }
        : prevLeg.op === nextLeg.op
          ? { minutes: 30, rule: `Same ${place}, same operator, seat to seat` }
          : {
              minutes: 90,
              rule: `Same ${place}, different operators — no through ticketing, no held connection`,
            }
    )

    if (nextLeg.mode === 'ferry') {
      const label =
        prevLeg.mode === 'road'
          ? 'Onward ferry reached by road transfer'
          : prevLeg.mode === 'ferry'
            ? 'Ferry to ferry at the same terminal'
            : 'Rail to ferry in the same town'
      rules.push({ minutes: prevLeg.mode === 'road' ? 240 : 120, rule: label })
    }

    const border = network.borders[nextLeg.borderAtStart] || network.borders[prevLeg.borderAtEnd]
    if (border) {
      const onFoot = (border.minutes ?? 60) >= 180
      rules.push({
        minutes: onFoot ? 240 : 120,
        rule: onFoot
          ? 'International border crossed on foot'
          : 'International border with a change of train',
      })
    }

    // The Vientiane problem: two railways, two gauges, fifteen kilometres and
    // no track between them.
    const a = network.stations[next.fromId]
    const b = network.stations[next.toId]
    if (
      nextLeg.essential &&
      nextLeg.mode === 'road' &&
      a && b &&
      a.city === b.city &&
      a.gauge && b.gauge &&
      a.gauge !== b.gauge
    ) {
      rules.push({ minutes: 180, rule: 'Cross-city transfer between two unconnected stations' })
    }

    if (prevLeg.sleeper && prevLeg.hours >= 7) {
      rules.push({ minutes: 120, rule: 'Arriving off a sleeper onto a long-distance departure' })
    }

    const governing = rules.reduce((m, r) => (r.minutes > m.minutes ? r : m), rules[0])
    const chained = prevLeg.sleeper && nextLeg.sleeper && prevLeg.hours >= 7 && nextLeg.hours >= 7

    return {
      minutes: governing.minutes,
      rule: governing.rule,
      chainedSleepers: chained,
      unpunctual: network.operators[prevLeg.op]?.punctual === 'poor',
    }
  }

  /* ---------------------------------------------------------- seasonality */
  function seasonHits(network, dateStr) {
    if (!dateStr) return []
    const md = dateStr.slice(5, 10)
    return network.seasons.filter(s => {
      // Ranges here never wrap the year end, so a plain string compare is safe.
      return md >= s.from && md <= s.to
    })
  }

  function countriesOn(network, stationIds) {
    return [...new Set(stationIds.map(id => network.stations[id].country))]
  }

  /* --------------------------------------------------------------- costs */
  function flightComparison(network, fromId, toId) {
    const a = network.stations[fromId]
    const b = network.stations[toId]
    const km = Proj.haversine(a, b)
    // Cruise plus taxi, climb and descent — gate to gate, not airport to
    // airport, and deliberately not counting the two hours before the gate.
    const hours = km / 800 + 0.75
    const mid = 45 + km * 0.055
    return {
      km: Math.round(km),
      hours,
      low: Math.round(mid * 0.65),
      high: Math.round(mid * 1.35),
    }
  }

  /* -------------------------------------------------------------- risks */
  function buildRisks(network, legs, junctions, seasons, opts) {
    const risks = []
    const seenBorders = new Set()

    for (const s of seasons) {
      risks.push({
        severity: 'critical',
        title: `Your dates fall in ${s.name}`,
        text: s.text + (s.fixed ? '' : ' These dates move each year — the window shown here is approximate.'),
        fix: 'Move the trip by a week either side if you possibly can. If you cannot, book the moment every window opens and accept that some legs will be unobtainable in your preferred class.',
      })
    }

    legs.forEach((entry, i) => {
      const leg = entry.leg

      if (leg.advisory) {
        risks.push({
          severity: 'critical',
          title: `Security advisory on the ${entry.fromName} – ${entry.toName} leg`,
          text: network.advisories[leg.advisory],
          fix: 'Check your own government\'s current travel advice and decide deliberately. There is a west-coast alternative via Padang Besar that avoids this entirely.',
          legIndex: i,
        })
      }

      for (const borderId of leg.borderIds) {
        const border = network.borders[borderId]
        if (!border || seenBorders.has(borderId)) continue
        seenBorders.add(borderId)
        if (border.hard) {
          risks.push({
            severity: 'critical',
            title: `${border.name} needs a visa you cannot get at the border`,
            text: border.visa + ' ' + border.trap,
            fix: 'Obtain the visa before you leave. If you cannot, this half of the route is closed to you and the itinerary should be replanned to stop short of the frontier.',
            legIndex: i,
          })
        } else if (border.verify) {
          risks.push({
            severity: 'caution',
            title: `${border.name} has a moving part`,
            text: border.verifyNote || border.trap,
            fix: 'Confirm the current position before you book anything that depends on it.',
            legIndex: i,
          })
        }
      }

      if (leg.confidence === 'verify') {
        risks.push({
          severity: 'caution',
          title: `${entry.fromName} to ${entry.toName} is not a service we can stand behind`,
          text: leg.note || 'This service has a history of changing, suspending or running on limited days.',
          fix: 'Verify it is running on your date before you build the rest of the itinerary around it.',
          legIndex: i,
        })
      }

      if (leg.mode === 'ferry' && !leg.essential) {
        risks.push({
          severity: 'note',
          title: `The ${entry.fromName} – ${entry.toName} boat is weather-dependent`,
          text: 'Ferries are cancelled rather than delayed, and a cancellation costs a day rather than an afternoon.',
          fix: 'Never make this crossing the only path to a fixed commitment. Leave a slack day between it and any flight home.',
          legIndex: i,
        })
      }
    })

    junctions.forEach(j => {
      if (j.chainedSleepers) {
        risks.push({
          severity: 'caution',
          title: `Two sleepers back to back at ${j.stationName}`,
          text: 'Chaining overnight trains looks efficient on paper and is punishing in practice. Two nights of broken sleep with a border in between is how people abandon an itinerary halfway.',
          fix: 'Insert a hotel night here. It costs one night and rescues the rest of the trip.',
        })
      } else if (j.minutes >= 180) {
        risks.push({
          severity: 'caution',
          title: `${j.stationName} needs ${Math.round(j.minutes / 60)} hours, not a connection`,
          text: `${j.rule}. A gap smaller than this is not a connection — it is a missed train with a plausible-looking timetable behind it.`,
          fix: j.minutes >= 240
            ? 'Plan an overnight stop here rather than trying to make it in one day.'
            : 'Allow the full window, and prefer a later onward service over the tightest one that appears to work.',
        })
      } else if (j.unpunctual && j.minutes >= 120) {
        risks.push({
          severity: 'caution',
          title: `${j.stationName} depends on an SRT arrival being roughly on time`,
          text: 'SRT long-distance services routinely run 30 to 90 minutes late, and southbound to Hat Yai is the worst offender. It is the arrival that feeds this connection.',
          fix: 'Take the later onward departure, not the first one that appears to connect. An overnight in Hat Yai removes the problem entirely.',
        })
      }
    })

    if (opts.railOnly) {
      const forced = legs.filter(e => e.leg.mode === 'road')
      if (forced.length) {
        risks.push({
          severity: 'note',
          title: `${forced.length} road ${forced.length === 1 ? 'leg is' : 'legs are'} unavoidable even in rail-only mode`,
          text: 'These are station transfers and pier shuttles with no rail alternative — a taxi across Vientiane, a walk between two railheads at a border. Excluding them would not route around the gap; it would just make the journey impossible.',
          fix: 'None needed. They are part of the rail journey, not a substitute for it.',
        })
      }
    }

    const order = { critical: 0, caution: 1, note: 2 }
    return risks.sort((a, b) => order[a.severity] - order[b.severity])
  }

  /* ------------------------------------------------------- booking order */
  function bookingOrder(network, legs) {
    const usedOps = new Set(legs.map(e => e.leg.op))
    const usedServices = new Set(legs.map(e => e.leg.service))
    const out = []

    for (const item of network.scarcity) {
      if (!usedOps.has(item.op)) continue
      if (item.service && ![...usedServices].some(s => s && s.includes(item.service))) continue
      out.push({ ...item, operator: network.operators[item.op] })
    }
    return out.sort((a, b) => a.rank - b.rank)
  }

  /* --------------------------------------------------------------- build */
  function build(network, routed, opts = {}) {
    const legs = mergeSegments(network, routed.path).map(leg => {
      const fromId = leg.steps[0].from
      const toId = leg.steps[leg.steps.length - 1].to
      const from = network.stations[fromId]
      const to = network.stations[toId]
      const via = [...new Set(leg.steps.slice(0, -1).map(s => network.stations[s.to].city))].filter(
        c => c !== from.city && c !== to.city
      )
      return {
        leg,
        fromId,
        toId,
        via,
        fromName: from.name,
        toName: to.name,
        fromCity: from.city,
        toCity: to.city,
        operator: network.operators[leg.op],
      }
    })

    const junctions = []
    for (let i = 0; i < legs.length - 1; i++) {
      const buf = bufferFor(network, legs[i], legs[i + 1])
      junctions.push({
        ...buf,
        afterLeg: i,
        stationId: legs[i].toId,
        stationName: legs[i].toName,
      })
    }

    const railHours = legs.filter(e => e.leg.mode === 'rail').reduce((n, e) => n + e.leg.hours, 0)
    const seaHours = legs.filter(e => e.leg.mode === 'ferry').reduce((n, e) => n + e.leg.hours, 0)
    const roadHours = legs.filter(e => e.leg.mode === 'road').reduce((n, e) => n + e.leg.hours, 0)
    const bufferHours = junctions.reduce((n, j) => n + j.minutes / 60, 0)
    const movingHours = railHours + seaHours + roadHours + bufferHours

    const pace = PACE_HOURS[opts.pace] ?? PACE_HOURS.standard
    const days = Math.max(1, Math.ceil(movingHours / pace))
    const sleeperNights = legs.filter(e => e.leg.sleeper && e.leg.hours >= 7).length
    const hotelNights = Math.max(0, days - 1 - sleeperNights)

    const transportUsd = legs.reduce((n, e) => n + (e.leg.usd ?? 0), 0)
    const lodgingUsd = hotelNights * HOTEL_USD

    const stationIds = routed.stations
    const stopIds = [legs[0].fromId, ...legs.map(e => e.toId)]

    const borders = []
    const seen = new Set()
    for (const entry of legs) {
      for (const id of entry.leg.borderIds) {
        if (seen.has(id)) continue
        seen.add(id)
        borders.push({ ...network.borders[id], id, atLeg: entry })
      }
    }

    const zones = [...new Set(stationIds.map(id => tzOf(network, id)))].sort((a, b) => a - b)
    const seasons = seasonHits(network, opts.date)

    const detours = Object.entries(DETOURS)
      .filter(([id]) => stationIds.includes(id))
      .map(([id, d]) => ({ ...d, stationId: id }))

    const verifyCount = legs.filter(e => e.leg.confidence === 'verify').length

    return {
      legs,
      junctions,
      borders,
      stationIds,
      stopIds,
      countries: countriesOn(network, stationIds),
      zones,
      seasons,
      detours,
      risks: buildRisks(network, legs, junctions, seasons, opts),
      booking: bookingOrder(network, legs),
      totals: {
        railHours,
        seaHours,
        roadHours,
        bufferHours,
        movingHours,
        days,
        sleeperNights,
        hotelNights,
        transportUsd,
        lodgingUsd,
        totalUsd: transportUsd + lodgingUsd,
        borders: borders.length,
        legs: legs.length,
        verifyCount,
      },
      flight: flightComparison(network, stationIds[0], stationIds[stationIds.length - 1]),
      opts,
    }
  }

  return { build, bufferFor, seasonHits, DETOURS, HOTEL_USD, clone }
})()


/* ===== src/map.js ===== */
/* Canvas map. The route is the hero, so everything else is drawn to sit under
 * it: coastline as a quiet ground, the unused network as a faint lattice, and
 * the chosen itinerary on top in the three modes.
 *
 * Modes are distinguished by line style as well as hue — solid rail, dashed
 * sea, dotted road — so the shape of a journey survives both themes and any
 * kind of colour blindness.
 */

const MapView = (() => {
  const STYLE = {
    rail: { dash: [], width: 3.4 },
    ferry: { dash: [7, 5], width: 2.6 },
    road: { dash: [1.5, 4], width: 2.6 },
  }

  function themeColors(root) {
    const cs = getComputedStyle(root)
    const get = n => cs.getPropertyValue(n).trim()
    return {
      sea: get('--sea'),
      land: get('--land'),
      landEdge: get('--land-edge'),
      idle: get('--idle-line'),
      idleDot: get('--idle-dot'),
      rail: get('--rail'),
      ferry: get('--ferry'),
      road: get('--road'),
      alert: get('--alert'),
      ink: get('--ink'),
      muted: get('--muted'),
      panel: get('--panel'),
    }
  }

  function create(canvas, network, basemap) {
    const ctx = canvas.getContext('2d')
    let view = null
    let hit = { stations: [], segments: [] }
    let state = {
      route: null, // {legs:[{leg,fromId,toId}], stationIds:[]}
      progress: 1,
      hover: null,
      focusLeg: null,
    }
    let colors = themeColors(document.documentElement)
    let raf = null
    // The controls and the itinerary panel overlay the map on wide screens, so
    // a route fitted to the full canvas ends up half-hidden behind them.
    let inset = { left: 0, right: 0 }

    /** Fit into the strip the overlays leave visible, then shift it into place. */
    function fitVisible(rect, fit) {
      const strip = Math.max(240, rect.width - inset.left - inset.right)
      const fitted = fit(strip)
      return {
        ...fitted,
        w: rect.width,
        h: rect.height,
        dx: fitted.dx + inset.left,
      }
    }

    function baseView(rect) {
      const pad = rect.width < 700 ? 12 : 28
      return fitVisible(rect, strip => Proj.create(basemap.bbox, strip, rect.height, pad))
    }

    function size() {
      const rect = canvas.getBoundingClientRect()
      const dpr = Math.min(3, window.devicePixelRatio || 1)
      canvas.width = Math.max(1, Math.round(rect.width * dpr))
      canvas.height = Math.max(1, Math.round(rect.height * dpr))
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0)

      if (!view) {
        view = baseView(rect)
      } else {
        // Preserve the centre and zoom factor across a resize.
        const zoom = view.scale / view.baseScale
        const centre = Proj.unproject(view, view.w / 2, view.h / 2)
        const fresh = baseView(rect)
        fresh.scale = fresh.baseScale * zoom
        fresh.dx = rect.width / 2 - centre.lon * fresh.scale
        fresh.dy = rect.height / 2 - Proj.screenY(centre.lat) * fresh.scale
        view = fresh
      }
      return rect
    }

    const P = id => {
      const s = network.stations[id]
      return Proj.project(view, s.lon, s.lat)
    }

    /* Cities with more than one station get labelled by station name even when
     * zoomed out. Two dots both reading "Vientiane" looks like a rendering bug
     * rather than what it is — the single most important fact on this map. */
    const sharedCities = (() => {
      const counts = new Map()
      for (const s of Object.values(network.stations)) {
        counts.set(s.city, (counts.get(s.city) ?? 0) + 1)
      }
      return new Set([...counts].filter(([, n]) => n > 1).map(([city]) => city))
    })()

    /* ------------------------------------------------------------ drawing */

    function drawBasemap() {
      ctx.fillStyle = colors.sea
      ctx.fillRect(0, 0, view.w, view.h)

      ctx.lineJoin = 'round'
      for (const country of basemap.countries) {
        ctx.beginPath()
        for (const ring of country.rings) {
          for (let i = 0; i < ring.length; i++) {
            const p = Proj.project(view, ring[i][0], ring[i][1])
            if (i === 0) ctx.moveTo(p.x, p.y)
            else ctx.lineTo(p.x, p.y)
          }
          ctx.closePath()
        }
        ctx.fillStyle = colors.land
        ctx.fill()
        ctx.strokeStyle = colors.landEdge
        ctx.lineWidth = 0.8
        ctx.stroke()
      }
    }

    /** Ferries arc; land legs run straight between stations. */
    function pathFor(leg) {
      const a = P(leg.from)
      const b = P(leg.to)
      if (leg.mode !== 'ferry') return { a, b, ctrl: null }
      const mx = (a.x + b.x) / 2
      const my = (a.y + b.y) / 2
      const dx = b.x - a.x
      const dy = b.y - a.y
      const len = Math.hypot(dx, dy) || 1
      const bow = Math.min(26, len * 0.16)
      return { a, b, ctrl: { x: mx - (dy / len) * bow, y: my + (dx / len) * bow } }
    }

    function strokePath(p, style, color, width, alpha = 1) {
      ctx.save()
      ctx.globalAlpha = alpha
      ctx.strokeStyle = color
      ctx.lineWidth = width
      ctx.lineCap = style.dash.length ? 'butt' : 'round'
      ctx.setLineDash(style.dash.map(d => d * (width / 3)))
      ctx.beginPath()
      ctx.moveTo(p.a.x, p.a.y)
      if (p.ctrl) ctx.quadraticCurveTo(p.ctrl.x, p.ctrl.y, p.b.x, p.b.y)
      else ctx.lineTo(p.b.x, p.b.y)
      ctx.stroke()
      ctx.restore()
    }

    function drawIdleNetwork(usedLegs) {
      for (const leg of network.legs) {
        if (usedLegs.has(leg)) continue
        const p = pathFor(leg)
        strokePath(p, STYLE[leg.mode], colors.idle, leg.mode === 'rail' ? 1.6 : 1.2, 1)
      }
    }

    function drawIdleStations(routeSet) {
      const zoom = view.scale / view.baseScale
      for (const [id, s] of Object.entries(network.stations)) {
        if (routeSet.has(id)) continue
        if (s.minor && zoom < 2.2) continue
        const p = Proj.project(view, s.lon, s.lat)
        ctx.beginPath()
        ctx.arc(p.x, p.y, s.hub ? 3 : 2, 0, Math.PI * 2)
        ctx.fillStyle = colors.idleDot
        ctx.fill()
      }
    }

    /** Partial-length drawing so the route can animate in along its own length. */
    function drawRoute() {
      if (!state.route) return
      const legs = state.route.legs
      const total = legs.reduce((n, e) => n + e.leg.hours, 0) || 1
      let drawn = 0
      const target = state.progress * total

      legs.forEach((entry, i) => {
        const leg = entry.leg
        if (drawn >= target) return
        const frac = Math.min(1, (target - drawn) / leg.hours)
        drawn += leg.hours

        const color = colors[leg.mode]
        const style = STYLE[leg.mode]
        const focused = state.focusLeg === i
        const dim = state.focusLeg != null && !focused

        // One leg is one vehicle but several segments of track, so it draws as
        // a polyline through the stations it calls at.
        const steps = leg.steps
        const cut = frac * steps.length
        steps.forEach((step, k) => {
          if (k >= cut) return
          const partial = Math.min(1, cut - k)
          const p = pathFor(step)
          const end =
            partial >= 1
              ? p
              : {
                  a: p.a,
                  ctrl: p.ctrl,
                  b: {
                    x: p.a.x + (p.b.x - p.a.x) * partial,
                    y: p.a.y + (p.b.y - p.a.y) * partial,
                  },
                }
          // Halo keeps the line legible where it crosses a coastline.
          strokePath(end, style, colors.sea, style.width + 4, dim ? 0.35 : 0.9)
          strokePath(end, style, color, focused ? style.width + 1.6 : style.width, dim ? 0.35 : 1)
        })
      })
    }

    function drawRouteStations() {
      if (!state.route) return
      const stops = state.route.stopIds || state.route.stationIds

      // Intermediate calls get a plain dot; the stations where you actually
      // change vehicles get a ring, because those are the decisions.
      for (const id of state.route.stationIds) {
        if (stops.includes(id)) continue
        const s = network.stations[id]
        const p = Proj.project(view, s.lon, s.lat)
        ctx.beginPath()
        ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2)
        ctx.fillStyle = colors.rail
        ctx.fill()
      }

      stops.forEach((id, i) => {
        const s = network.stations[id]
        const p = Proj.project(view, s.lon, s.lat)
        const terminal = i === 0 || i === stops.length - 1
        const r = terminal ? 6.5 : 4.5

        ctx.beginPath()
        ctx.arc(p.x, p.y, r + 2.5, 0, Math.PI * 2)
        ctx.fillStyle = colors.sea
        ctx.fill()

        ctx.beginPath()
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2)
        ctx.fillStyle = terminal ? colors.rail : colors.panel
        ctx.fill()
        ctx.lineWidth = 2
        ctx.strokeStyle = colors.rail
        ctx.stroke()
      })

      // Border markers sit on top of everything, because they are the thing
      // most likely to end the journey.
      for (const entry of state.route.legs) {
        for (const step of entry.leg.steps) {
          if (!step.border) continue
          drawBorderMark(P(step.from), P(step.to))
        }
      }
    }

    function drawBorderMark(a, b) {
      const size = 5
      ctx.save()
      ctx.translate((a.x + b.x) / 2, (a.y + b.y) / 2)
      ctx.rotate(Math.PI / 4)
      ctx.fillStyle = colors.alert
      ctx.strokeStyle = colors.sea
      ctx.lineWidth = 2
      ctx.beginPath()
      ctx.rect(-size, -size, size * 2, size * 2)
      ctx.stroke()
      ctx.fill()
      ctx.restore()
    }

    function drawLabels() {
      const zoom = view.scale / view.baseScale
      const placed = []
      const overlaps = box =>
        placed.some(
          b =>
            box.x < b.x + b.w && box.x + box.w > b.x && box.y < b.y + b.h && box.y + box.h > b.y
        )

      const routeIds = state.route ? state.route.stopIds || state.route.stationIds : []
      const candidates = []

      routeIds.forEach((id, i) => {
        candidates.push({ id, priority: i === 0 || i === routeIds.length - 1 ? 0 : 1 })
      })
      for (const [id, s] of Object.entries(network.stations)) {
        if (routeIds.includes(id)) continue
        if (s.hub) candidates.push({ id, priority: 2 })
        else if (zoom > 2.6 && !s.minor) candidates.push({ id, priority: 3 })
      }
      candidates.sort((a, b) => a.priority - b.priority)

      for (const c of candidates) {
        const s = network.stations[c.id]
        const p = Proj.project(view, s.lon, s.lat)
        if (p.x < -40 || p.x > view.w + 40 || p.y < -20 || p.y > view.h + 20) continue

        const onRoute = c.priority <= 1
        const weight = c.priority === 0 ? 600 : 500
        const base = c.priority === 0 ? 15 : c.priority === 1 ? 13 : 12
        const fontSize = view.w < 520 ? base - 2 : base
        ctx.font = `${weight} ${fontSize}px BarlowCond, system-ui, sans-serif`
        const text = c.priority <= 1 || sharedCities.has(s.city) ? s.name : s.city
        const w = ctx.measureText(text).width
        const h = fontSize + 4
        const right = { x: p.x + 10, y: p.y - fontSize / 2 - 2, w: w + 6, h }
        const left = { x: p.x - w - 14, y: right.y, w: w + 6, h }

        // Prefer the right of the dot, fall back to the left, and skip the
        // label entirely rather than let it run off the canvas.
        const fits = box => box.x >= 4 && box.x + box.w <= view.w - 4 && !overlaps(box)
        const box = fits(right) ? right : fits(left) ? left : null
        if (!box) continue
        placed.push(box)

        ctx.save()
        ctx.textBaseline = 'middle'
        ctx.lineWidth = 3.5
        ctx.strokeStyle = colors.sea
        ctx.globalAlpha = onRoute ? 0.95 : 0.7
        ctx.strokeText(text, box.x + 3, p.y)
        ctx.fillStyle = onRoute ? colors.ink : colors.muted
        ctx.fillText(text, box.x + 3, p.y)
        ctx.restore()
      }
    }

    function buildHitTargets() {
      hit = { stations: [], segments: [] }
      for (const [id, s] of Object.entries(network.stations)) {
        const p = Proj.project(view, s.lon, s.lat)
        hit.stations.push({ id, x: p.x, y: p.y, station: s })
      }
      if (state.route) {
        state.route.legs.forEach((entry, i) => {
          for (const step of entry.leg.steps) {
            hit.segments.push({ index: i, a: P(step.from), b: P(step.to), entry })
          }
        })
      }
    }

    function draw() {
      if (!view) return
      colors = themeColors(document.documentElement)
      const used = new Set(state.route ? state.route.legs.map(e => e.leg) : [])
      const routeSet = new Set(state.route ? state.route.stationIds : [])

      drawBasemap()
      drawIdleNetwork(used)
      drawIdleStations(routeSet)
      drawRoute()
      drawRouteStations()
      drawLabels()
      buildHitTargets()
    }

    /* ---------------------------------------------------------- animation */

    function animateIn() {
      if (raf) cancelAnimationFrame(raf)
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        state.progress = 1
        draw()
        return
      }
      state.progress = 0
      const start = performance.now()
      const duration = 900
      const step = now => {
        const t = Math.min(1, (now - start) / duration)
        // easeOutCubic: quick commitment, gentle arrival
        state.progress = 1 - Math.pow(1 - t, 3)
        draw()
        if (t < 1) raf = requestAnimationFrame(step)
        else raf = null
      }
      raf = requestAnimationFrame(step)
    }

    /* ------------------------------------------------------------ hit test */

    function distToSegment(px, py, a, b) {
      const dx = b.x - a.x
      const dy = b.y - a.y
      const len2 = dx * dx + dy * dy
      if (!len2) return Math.hypot(px - a.x, py - a.y)
      let t = ((px - a.x) * dx + (py - a.y) * dy) / len2
      t = Math.max(0, Math.min(1, t))
      return Math.hypot(px - (a.x + t * dx), py - (a.y + t * dy))
    }

    function pick(x, y) {
      let bestStation = null
      let bestD = 14
      for (const s of hit.stations) {
        const d = Math.hypot(x - s.x, y - s.y)
        if (d < bestD) {
          bestD = d
          bestStation = s
        }
      }
      if (bestStation) return { type: 'station', ...bestStation }

      let bestSeg = null
      let bestSegD = 10
      for (const s of hit.segments) {
        const d = distToSegment(x, y, s.a, s.b)
        if (d < bestSegD) {
          bestSegD = d
          bestSeg = s
        }
      }
      if (bestSeg) return { type: 'leg', ...bestSeg }
      return null
    }

    /* ------------------------------------------------------------- public */

    return {
      resize() {
        size()
        draw()
      },
      setInset(next) {
        inset = { left: 0, right: 0, ...next }
      },
      setRoute(route, animate = true) {
        state.route = route
        state.focusLeg = null
        if (route && route.stationIds.length) {
          const pts = route.stationIds.map(id => network.stations[id])
          const rect = canvas.getBoundingClientRect()
          const pad = rect.width < 700 ? 40 : 70
          view = fitVisible(rect, strip =>
            Proj.fitPoints({ ...view, w: strip }, pts, pad)
          )
        }
        if (animate) animateIn()
        else {
          state.progress = 1
          draw()
        }
      },
      focusLeg(index) {
        if (state.focusLeg === index) return
        state.focusLeg = index
        draw()
      },
      panBy(dx, dy) {
        view = Proj.pan(view, dx, dy)
        draw()
      },
      zoomAt(x, y, factor) {
        view = Proj.zoomAt(view, x, y, factor)
        draw()
      },
      resetView() {
        view = baseView(canvas.getBoundingClientRect())
        draw()
      },
      pick,
      redraw: draw,
    }
  }

  return { create, STYLE }
})()


/* ===== src/ui.js ===== */
/* Panel rendering. The map shows the shape of the journey; this shows whether
 * it works. Order matters and is fixed: risk flags arrive before booking links,
 * because a traveller who books before reading the Padang Besar timezone note
 * has already lost the connection.
 */

const UI = (() => {
  const esc = s =>
    String(s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])
    )

  const MODE_LABEL = { rail: 'Rail', ferry: 'Sea', road: 'Road' }

  function hours(h) {
    if (h == null) return '—'
    if (h < 1) return `${Math.round(h * 60)}m`
    const whole = Math.floor(h)
    const mins = Math.round((h - whole) * 60)
    if (whole >= 24) {
      const d = Math.floor(whole / 24)
      return `${d}d ${whole % 24}h`
    }
    return mins ? `${whole}h ${mins}m` : `${whole}h`
  }

  const money = n => (n < 10 ? `$${n.toFixed(n % 1 ? 1 : 0)}` : `$${Math.round(n)}`)

  const CONFIDENCE = {
    structural: { label: 'Structural', tone: 'ok', title: 'A physical or administrative fact — stations, gauges, who stamps where. Stable for years.' },
    reported: { label: 'Reported', tone: 'ok', title: 'Consistent across the operator pages, Seat61 and Richard Barrow\'s Thai train guide.' },
    verify: { label: 'Verify', tone: 'warn', title: 'Volatile or known to suspend. Confirm this one is running before you book around it.' },
  }

  /* ------------------------------------------------------------- the lede */

  function lede(network, plan, fromId, toId) {
    const t = plan.totals
    const from = network.stations[fromId]
    const to = network.stations[toId]
    const railShare = t.railHours / Math.max(1, t.railHours + t.seaHours + t.roadHours)

    const modes = []
    const railLegs = plan.legs.filter(e => e.leg.mode === 'rail').length
    const seaLegs = plan.legs.filter(e => e.leg.mode === 'ferry').length
    const roadLegs = plan.legs.filter(e => e.leg.mode === 'road').length
    if (railLegs) modes.push(`${railLegs} on rails`)
    if (seaLegs) modes.push(`${seaLegs} by sea`)
    if (roadLegs) modes.push(`${roadLegs} by road`)

    let character
    if (railShare > 0.85) character = 'a genuine rail journey almost end to end'
    else if (railShare > 0.6) character = 'a rail journey with the gaps bridged'
    else if (railShare > 0.25) character = 'a rail journey for part of its length and an honest slog for the rest'
    else character = 'not really a rail journey at all — the railways do not go this way'

    const sentences = []
    sentences.push(
      `${esc(from.city)} to ${esc(to.city)} is ${character}: ${t.legs} legs (${modes.join(', ')}) ` +
        `across ${plan.countries.length} ${plan.countries.length === 1 ? 'country' : 'countries'}, ` +
        `with ${t.borders} ${t.borders === 1 ? 'frontier' : 'frontiers'} in between.`
    )

    const top = plan.risks[0]
    if (top) sentences.push(`The one to watch: ${esc(top.title)}.`)

    const longestRoad = plan.legs
      .filter(e => e.leg.mode === 'road' && !e.leg.essential)
      .sort((a, b) => b.leg.hours - a.leg.hours)[0]
    const scenic = plan.legs.filter(e => e.leg.scenic).length

    if (longestRoad && longestRoad.leg.hours >= 10) {
      sentences.push(
        `Be clear-eyed about the ${hours(longestRoad.leg.hours)} coach from ` +
          `${esc(longestRoad.fromCity)} to ${esc(longestRoad.toCity)} — there is no railway on that ` +
          `corridor and no way to dress the bus up as anything else.`
      )
    } else if (scenic >= 3) {
      sentences.push(
        `It is genuinely enjoyable rather than merely possible: ${scenic} of these legs are worth ` +
          `taking for their own sake, and the sleepers replace hotel nights rather than costing you days.`
      )
    } else if (t.roadHours > t.railHours) {
      sentences.push(
        'It is possible, and that is about the strongest thing to say for it. If the point is the journey, ask for a different pair of endpoints.'
      )
    } else {
      sentences.push(
        'It works and it is comfortable enough, but the journey here is transport rather than the reward — plan the stops, not just the legs.'
      )
    }

    return sentences.join(' ')
  }

  /* ------------------------------------------------------------- sections */

  function statBar(plan) {
    const t = plan.totals
    const bits = [
      [`${t.days}`, t.days === 1 ? 'day' : 'days'],
      [`${t.legs}`, 'legs'],
      [`${t.borders}`, t.borders === 1 ? 'border' : 'borders'],
      [money(t.totalUsd), 'all in'],
      [hours(t.railHours), 'on rails'],
    ]
    if (t.seaHours) bits.push([hours(t.seaHours), 'at sea'])
    if (t.roadHours) bits.push([hours(t.roadHours), 'by road'])
    return `<div class="stats">${bits
      .map(([v, l]) => `<div class="stat"><b>${esc(v)}</b><span>${esc(l)}</span></div>`)
      .join('')}</div>`
  }

  function routeTable(network, plan) {
    const rows = plan.legs
      .map((entry, i) => {
        const leg = entry.leg
        const conf = CONFIDENCE[leg.confidence] || CONFIDENCE.reported
        const junction = plan.junctions.find(j => j.afterLeg === i)
        const cls = leg.cls ? `<span class="cls">${esc(leg.cls)}</span>` : ''

        const main = `
          <tr class="leg" data-leg="${i}" tabindex="0">
            <td class="num"><span class="mode-dot ${leg.mode}" aria-hidden="true"></span>${i + 1}</td>
            <td class="where">
              <b>${esc(entry.fromName)}</b>
              <span class="arrow" aria-hidden="true">→</span>
              <b>${esc(entry.toName)}</b>
              <span class="svc">${esc(leg.service)}${cls}</span>
              ${
                entry.via.length
                  ? `<span class="via">via ${esc(entry.via.join(' · '))}</span>`
                  : ''
              }
              ${leg.note ? `<span class="leg-note">${esc(leg.note)}</span>` : ''}
            </td>
            <td class="op">
              <span class="op-name">${esc(entry.operator.short)}</span>
              <span class="tag ${conf.tone}" title="${esc(conf.title)}">${esc(conf.label)}</span>
            </td>
            <td class="dur num-col">${esc(hours(leg.hours))}</td>
            <td class="fare num-col">${esc(money(leg.usd ?? 0))}</td>
          </tr>`

        if (!junction) return main
        const warn = junction.minutes >= 180 || junction.chainedSleepers
        return (
          main +
          `<tr class="junction ${warn ? 'warn' : ''}">
            <td></td>
            <td colspan="4">
              <span class="j-label">Change at ${esc(junction.stationName)}</span>
              <span class="j-buffer">allow ${junction.minutes >= 120 ? `${(junction.minutes / 60).toFixed(junction.minutes % 60 ? 1 : 0)} h` : `${junction.minutes} min`} minimum</span>
              <span class="j-rule">${esc(junction.rule)}</span>
            </td>
          </tr>`
        )
      })
      .join('')

    return `
      <section class="block">
        <h2>The route</h2>
        <p class="sub">Durations are typical scheduled running times, not departures. No planner in this
        region can give you a departure time you should trust — the operators publish nothing in common.
        Take these legs to the booking sites below and read the real clock there.</p>
        <div class="table-wrap">
          <table class="route">
            <thead><tr><th></th><th>Leg</th><th>Operator</th><th class="num-col">Time</th><th class="num-col">Fare</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </section>`
  }

  function timezoneStrip(network, plan) {
    if (plan.zones.length < 2) return ''
    const crossesPadang = plan.borders.some(b => b.id === 'padangbesar')
    return `
      <div class="callout ${crossesPadang ? 'alert' : ''}">
        <h3>${plan.zones.length} timezones: ${plan.zones.map(z => `UTC+${z}`).join(', ')}</h3>
        <p>${
          crossesPadang
            ? 'Padang Besar is the trap. SRT publishes its departures there in Thai time (UTC+7); KTMB publishes the same platform in Malaysian time (UTC+8). Read both operators\' sites and you will build a connection exactly one hour different from reality, in the direction that makes you miss it. Convert everything to one clock before you book anything.'
            : 'Convert every published time to a single clock in your own notes before you book. Operators publish in their own local time and label it inconsistently.'
        }</p>
      </div>`
  }

  function borderSection(network, plan) {
    if (!plan.borders.length) return ''
    const blocks = plan.borders
      .map(b => {
        const rows = [
          ['Where', b.at],
          ['On the train?', b.stayOnTrain],
          ['Luggage', b.luggage],
          ['Visa', b.visa],
          ['Cash on the far side', b.cash],
          ['Time cost', `About ${b.minutes} minutes of formalities`],
        ]
        return `
          <article class="crossing ${b.hard ? 'hard' : ''}">
            <header>
              <h3>${esc(b.name)}</h3>
              <span class="countries">${esc(b.countries)}</span>
            </header>
            <dl>
              ${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}
            </dl>
            <p class="trap"><b>The trap.</b> ${esc(b.trap)}</p>
            ${b.buffer ? `<p class="trap"><b>Buffer.</b> ${esc(b.buffer)}</p>` : ''}
            ${b.verifyNote ? `<p class="trap verify"><b>Verify.</b> ${esc(b.verifyNote)}</p>` : ''}
          </article>`
      })
      .join('')

    return `<section class="block"><h2>Border crossings</h2>
      <p class="sub">Itineraries die at frontiers, not on track. Never plan one of these without
      checking the current position for your own passport.</p>${blocks}</section>`
  }

  function risksSection(plan) {
    if (!plan.risks.length) {
      return `<section class="block"><h2>Where this breaks</h2>
        <p class="sub">Nothing on this route trips the risk rules — which is unusual, and worth
        double-checking against the operators before you take it as read.</p></section>`
    }
    const items = plan.risks
      .map(
        r => `
        <li class="risk ${r.severity}">
          <span class="sev">${r.severity}</span>
          <h3>${esc(r.title)}</h3>
          <p>${esc(r.text)}</p>
          <p class="fix"><b>What to do.</b> ${esc(r.fix)}</p>
        </li>`
      )
      .join('')
    return `<section class="block"><h2>Where this breaks</h2>
      <p class="sub">Ranked by what actually ends trips, not by probability. A missed last connection
      costs a day and an unplanned hotel; a missed afternoon connection costs an afternoon.</p>
      <ol class="risks">${items}</ol></section>`
  }

  function bookingSection(network, plan) {
    const items = plan.booking
      .map(
        (b, i) => `
        <li>
          <span class="rank">${i + 1}</span>
          <div>
            <h3>${esc(b.service || b.operator.name)}</h3>
            <p class="window">${esc(b.window)}</p>
            <p>${esc(b.why)}</p>
            ${
              b.operator.book
                ? `<a class="book" href="${esc(b.operator.book)}" target="_blank" rel="noopener noreferrer">${esc(
                    new URL(b.operator.book).hostname.replace(/^www\./, '')
                  )}</a>`
                : '<span class="book none">Bought at the pier, or through a local agent</span>'
            }
          </div>
        </li>`
      )
      .join('')

    return `<section class="block"><h2>Booking sequence</h2>
      <p class="sub">Book in order of scarcity times window length, not in the order you travel.
      The shortest leg on the whole spine sells out first.</p>
      <ol class="booking">${items}</ol>
      <p class="sub foot">Where an operator cannot be booked from abroad — LCR above all — an
      aggregator such as 12Go or Baolau is the practical route in. They add a fee, and some sell
      tickets they do not yet hold and buy them when inventory opens, which is a genuine cancellation
      risk on a scarce sleeper. Prefer the operator wherever the operator actually works.</p>
      </section>`
  }

  function costSection(network, plan) {
    const t = plan.totals
    const f = plan.flight
    return `<section class="block"><h2>Costs</h2>
      <div class="table-wrap">
        <table class="costs">
          <tbody>
            <tr><td>Transport, ${t.legs} legs</td><td class="num-col">${esc(money(t.transportUsd))}</td></tr>
            <tr><td>Accommodation, ${t.hotelNights} ${t.hotelNights === 1 ? 'night' : 'nights'} at about $${Plan.HOTEL_USD}</td><td class="num-col">${esc(money(t.lodgingUsd))}</td></tr>
            ${
              t.sleeperNights
                ? `<tr class="saved"><td>${t.sleeperNights} ${t.sleeperNights === 1 ? 'night' : 'nights'} on a sleeper — a bed you already paid for in the fare</td><td class="num-col">included</td></tr>`
                : ''
            }
            <tr class="total"><td>Total</td><td class="num-col">${esc(money(t.totalUsd))}</td></tr>
          </tbody>
        </table>
      </div>
      <div class="compare">
        <h3>Against flying</h3>
        <p>
          <b>${t.days} ${t.days === 1 ? 'day' : 'days'}, ${esc(money(t.totalUsd))}, ${t.legs} legs</b>
          versus a flight of roughly <b>${esc(hours(f.hours))}</b> gate to gate at somewhere around
          <b>$${f.low}–${f.high}</b>. That fare band is estimated from the ${f.km} km great-circle
          distance, not from live inventory — check it.
        </p>
        <p class="honest">${
          t.days >= 3
            ? 'The plane wins on time and often on money. People take this route because the overland journey is the thing they want, not because it is efficient. If that is not you, fly — and there is no shame in the sleeper one way and the plane home.'
            : 'On a trip this short the train is genuinely competitive, and it puts you in the middle of a city rather than an hour outside one.'
        }</p>
      </div>
      </section>`
  }

  function detourSection(plan) {
    if (!plan.detours.length) return ''
    const items = plan.detours
      .map(
        d => `<li><h3>${esc(d.title)}</h3><span class="cost">${esc(d.cost)}</span><p>${esc(d.text)}</p></li>`
      )
      .join('')
    return `<section class="block"><h2>If you have more time</h2>
      <p class="sub">Where the slow-travel value actually is — the detours that turn a transit into a trip.</p>
      <ul class="detours">${items}</ul></section>`
  }

  function seasonBanner(plan) {
    if (!plan.seasons.length) return ''
    return plan.seasons
      .map(
        s => `<div class="callout alert season">
          <h3>Your dates fall in ${esc(s.name)}</h3>
          <p>${esc(s.text)}</p>
        </div>`
      )
      .join('')
  }

  /* ------------------------------------------------------------ assembled */

  function itinerary(network, plan, fromId, toId, opts) {
    const from = network.stations[fromId]
    const to = network.stations[toId]
    const t = plan.totals

    const stationWarnings = plan.stationIds
      .map(id => ({ id, s: network.stations[id] }))
      .filter(x => x.s.warn)
      .map(
        x => `<li><b>${esc(x.s.name)}</b> ${esc(x.s.warn)}</li>`
      )
      .join('')

    return `
      <header class="head">
        <p class="eyebrow">${esc(opts.railOnly ? 'Hard rail-only' : 'Pragmatic')} routing${
          opts.date ? ` · departing ${esc(opts.date)}` : ''
        }${opts.nationality ? ` · ${esc(opts.nationality)} passport` : ''}</p>
        <h1>${esc(from.city)} <span aria-hidden="true">→</span> ${esc(to.city)} overland</h1>
        ${statBar(plan)}
        <p class="lede">${lede(network, plan, fromId, toId)}</p>
      </header>
      ${seasonBanner(plan)}
      ${timezoneStrip(network, plan)}
      ${
        stationWarnings
          ? `<div class="callout"><h3>Stations that catch people out</h3><ul class="warns">${stationWarnings}</ul></div>`
          : ''
      }
      ${routeTable(network, plan)}
      ${borderSection(network, plan)}
      ${risksSection(plan)}
      ${bookingSection(network, plan)}
      ${costSection(network, plan)}
      ${detourSection(plan)}
      <footer class="foot-note">
        <p>Network reviewed ${esc(network.reviewed)}. ${
          t.verifyCount
            ? `${t.verifyCount} ${t.verifyCount === 1 ? 'leg on this route is' : 'legs on this route are'} marked <b>Verify</b> — those are the ones to confirm first.`
            : 'No leg on this route is currently flagged as volatile.'
        } Cross-check anything time-critical against the operator and against
        <a href="https://www.seat61.com/asia-trains.htm" target="_blank" rel="noopener noreferrer">Seat61</a>
        before you book. Fares are indicative.</p>
      </footer>`
  }

  function unreachable(network, fromId, toId, reachableSet, opts) {
    const from = network.stations[fromId]
    const to = network.stations[toId]

    // Name the station where the rails actually stop, on the destination's side.
    const target = network.stations[toId]
    let nearest = null
    let best = Infinity
    for (const id of reachableSet) {
      const s = network.stations[id]
      const d = Proj.haversine(s, target)
      if (d < best) {
        best = d
        nearest = { id, s, d }
      }
    }

    return `
      <header class="head">
        <p class="eyebrow">No route under these constraints</p>
        <h1>${esc(from.city)} <span aria-hidden="true">→</span> ${esc(to.city)}</h1>
      </header>
      <div class="callout alert">
        <h3>The rails do not go this way</h3>
        <p>${
          opts.railOnly
            ? 'In hard rail-only mode this pair has no chain of railways and unavoidable transfers connecting them. That is the honest answer, and stretching to give you a route would be worse than not having one.'
            : 'These two points are not connected by any chain of rail, sea or road legs in this network.'
        }</p>
        ${
          nearest
            ? `<p>Going as far as the railways allow gets you to <b>${esc(nearest.s.name)}</b>,
               about ${Math.round(nearest.d)} km short of ${esc(to.city)}.</p>`
            : ''
        }
        <p>${
          opts.railOnly
            ? 'Switch to pragmatic routing and the planner will bridge the gap with the minimum necessary road leg, and tell you exactly how long it is.'
            : 'Check whether either endpoint is on an isolated fragment — Sabah\'s line and northern Sumatra\'s connect to nothing else in Asia.'
        }</p>
      </div>`
  }

  function idle(network, presets) {
    const chips = presets
      .map(
        (p, i) =>
          `<button class="chip" data-preset="${i}"><b>${esc(p.label)}</b><span>${esc(p.note)}</span></button>`
      )
      .join('')

    const myths = network.myths
      .map(m => `<li><span class="belief">${esc(m.belief)}</span><span class="reality">${esc(m.reality)}</span></li>`)
      .join('')

    return `
      <header class="head">
        <p class="eyebrow">Rail-first overland planning</p>
        <h1>Southeast Asia<br>without flying</h1>
        <p class="lede">${esc(network.intro)}</p>
        <p class="sub">Every mainstream planner optimises for speed, so it answers
        “Vientiane to Kuala Lumpur” with a flight. This one optimises for continuity on the ground:
        it keeps you on rails as far as the rails go, puts a boat where the land ends, and uses a
        road vehicle only where neither exists.</p>
      </header>
      <section class="block">
        <h2>Start from a corridor</h2>
        <div class="chips">${chips}</div>
      </section>
      <section class="block">
        <h2>What people get wrong</h2>
        <p class="sub">Travellers arrive with these. All seven are load-bearing — each one has
        stranded somebody.</p>
        <ul class="myths">${myths}</ul>
      </section>
      <footer class="foot-note">
        <p>Network reviewed ${esc(network.reviewed)}. This planner gives you legs, operators,
        border mechanics and connection buffers — deliberately not departure times, because
        SRT, KTMB, LCR, DSVN and KAI publish nothing in a common format and a remembered
        departure is the fastest way to miss a train. Verify live before booking.</p>
      </footer>`
  }

  return { itinerary, idle, unreachable, esc, hours, money, MODE_LABEL }
})()


/* ===== src/app.js ===== */
/* Wiring: controls, map interaction, and keeping the panel and the map in sync.
 * The route is held in the URL hash so a plan can be sent to someone else.
 */

;(function () {
  const COUNTRY_NAME = {
    cn: 'China', la: 'Laos', th: 'Thailand', kh: 'Cambodia', vn: 'Vietnam',
    my: 'Malaysia', sg: 'Singapore', id: 'Indonesia', mm: 'Myanmar',
  }
  const COUNTRY_ORDER = ['cn', 'la', 'th', 'kh', 'vn', 'my', 'sg', 'id', 'mm']

  const PRESETS = [
    { label: 'The Spine', from: 'kunming', to: 'singapore', note: 'Kunming to Singapore — the only continuous rail corridor in the region' },
    { label: 'Bangkok → Singapore', from: 'bkk_aphiwat', to: 'singapore', note: 'The classic, and materially easier than every pre-2026 guide says' },
    { label: 'Laos → Malaysia', from: 'luangprabang', to: 'klsentral', note: 'The common ask. Pure spine, southbound' },
    { label: 'Singapore → Bali', from: 'singapore', to: 'denpasar', note: 'Land and sea the whole way. The flagship' },
    { label: 'Bangkok → Hanoi', from: 'bkk_aphiwat', to: 'hanoi', note: 'There is no rail answer. See what the honest one looks like' },
    { label: 'The Jungle Railway', from: 'klsentral', to: 'wakafbaharu', note: 'Slow, scenic, cult status — the journey as the point' },
  ]

  const $ = sel => document.querySelector(sel)
  const canvas = $('#map')
  const panel = $('#panel')
  const tooltip = $('#tip')

  const map = MapView.create(canvas, NETWORK, BASEMAP)

  const state = {
    from: null,
    to: null,
    railOnly: false,
    date: '',
    nationality: '',
    pace: 'standard',
    plan: null,
  }

  /* ------------------------------------------------------------- controls */

  function stationOptions(selectedId) {
    const byCountry = {}
    for (const [id, s] of Object.entries(NETWORK.stations)) {
      ;(byCountry[s.country] ??= []).push({ id, s })
    }
    return COUNTRY_ORDER.filter(c => byCountry[c])
      .map(c => {
        const opts = byCountry[c]
          .sort((a, b) => a.s.city.localeCompare(b.s.city) || a.s.name.localeCompare(b.s.name))
          .map(
            ({ id, s }) =>
              `<option value="${id}"${id === selectedId ? ' selected' : ''}>${UI.esc(
                s.city === s.name ? s.name : `${s.city} — ${s.name}`
              )}</option>`
          )
          .join('')
        return `<optgroup label="${UI.esc(COUNTRY_NAME[c])}">${opts}</optgroup>`
      })
      .join('')
  }

  function renderControls() {
    $('#from').innerHTML = `<option value="">Choose a station…</option>${stationOptions(state.from)}`
    $('#to').innerHTML = `<option value="">Choose a station…</option>${stationOptions(state.to)}`
    $('#railonly').checked = state.railOnly
    $('#date').value = state.date
    $('#nationality').value = state.nationality
    $('#pace').value = state.pace
  }

  /* ----------------------------------------------------------------- plan */

  function compute() {
    if (!state.from || !state.to || state.from === state.to) {
      state.plan = null
      map.setRoute(null, false)
      panel.innerHTML = UI.idle(NETWORK, PRESETS)
      resetScroll()
      return
    }

    const opts = {
      railOnly: state.railOnly,
      date: state.date,
      nationality: state.nationality,
      pace: state.pace,
    }
    const routed = Router.route(NETWORK, state.from, state.to, opts)

    if (!routed) {
      state.plan = null
      map.setRoute(null, false)
      const reach = Router.reachable(NETWORK, state.from, opts)
      panel.innerHTML = UI.unreachable(NETWORK, state.from, state.to, reach, opts)
      resetScroll()
      return
    }

    const plan = Plan.build(NETWORK, routed, opts)
    state.plan = plan
    map.setRoute({ legs: plan.legs, stationIds: plan.stationIds, stopIds: plan.stopIds })
    panel.innerHTML = UI.itinerary(NETWORK, plan, state.from, state.to, opts)
    resetScroll()
    bindPanel()
    writeHash()
  }

  /* On wide screens the panel scrolls independently; stacked, the window does,
     and a new route rendered below the fold is a route nobody reads. */
  function resetScroll() {
    panel.scrollTop = 0
    if (!window.matchMedia('(min-width: 60.0625rem)').matches) {
      const wrap = document.querySelector('.mapwrap')
      if (wrap) window.scrollTo({ top: wrap.offsetTop, behavior: 'smooth' })
    }
  }

  function bindPanel() {
    panel.querySelectorAll('tr.leg').forEach(row => {
      const i = Number(row.dataset.leg)
      const on = () => map.focusLeg(i)
      const off = () => map.focusLeg(null)
      row.addEventListener('mouseenter', on)
      row.addEventListener('focus', on)
      row.addEventListener('mouseleave', off)
      row.addEventListener('blur', off)
    })
  }

  /* ------------------------------------------------------------ url state */

  function writeHash() {
    const p = new URLSearchParams()
    p.set('from', state.from)
    p.set('to', state.to)
    if (state.railOnly) p.set('rail', '1')
    if (state.date) p.set('date', state.date)
    if (state.nationality) p.set('nat', state.nationality)
    if (state.pace !== 'standard') p.set('pace', state.pace)
    history.replaceState(null, '', '#' + p.toString())
  }

  function readHash() {
    const p = new URLSearchParams(location.hash.slice(1))
    const from = p.get('from')
    const to = p.get('to')
    if (from && NETWORK.stations[from]) state.from = from
    if (to && NETWORK.stations[to]) state.to = to
    state.railOnly = p.get('rail') === '1'
    state.date = p.get('date') || ''
    state.nationality = p.get('nat') || ''
    state.pace = p.get('pace') || 'standard'
  }

  /* -------------------------------------------------------- map behaviour */

  let drag = null

  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId)
    drag = { x: e.offsetX, y: e.offsetY, moved: 0 }
  })

  canvas.addEventListener('pointermove', e => {
    if (drag) {
      const dx = e.offsetX - drag.x
      const dy = e.offsetY - drag.y
      drag.moved += Math.abs(dx) + Math.abs(dy)
      drag.x = e.offsetX
      drag.y = e.offsetY
      map.panBy(dx, dy)
      hideTip()
      return
    }

    const found = map.pick(e.offsetX, e.offsetY)
    canvas.style.cursor = found ? 'pointer' : 'grab'
    if (!found) return hideTip()

    if (found.type === 'station') {
      const s = found.station
      showTip(
        e.offsetX,
        e.offsetY,
        `<b>${UI.esc(s.name)}</b><span>${UI.esc(s.city)}, ${UI.esc(COUNTRY_NAME[s.country])}${
          s.gauge ? ` · ${UI.esc(s.gauge)} gauge` : ''
        }</span>${s.warn ? `<em>${UI.esc(s.warn)}</em>` : ''}`
      )
      map.focusLeg(null)
    } else {
      const leg = found.entry.leg
      showTip(
        e.offsetX,
        e.offsetY,
        `<b>${UI.esc(found.entry.fromName)} → ${UI.esc(found.entry.toName)}</b>
         <span>${UI.esc(leg.service)} · ${UI.esc(UI.hours(leg.hours))} · ${UI.esc(
          UI.money(leg.usd ?? 0)
        )}</span>`
      )
      map.focusLeg(found.index)
    }
  })

  canvas.addEventListener('pointerup', e => {
    const wasDrag = drag && drag.moved > 6
    drag = null
    canvas.style.cursor = 'grab'
    if (wasDrag) return

    const found = map.pick(e.offsetX, e.offsetY)
    if (!found || found.type !== 'station') return
    // First click sets the origin, second the destination, then it cycles.
    if (!state.from || (state.from && state.to)) {
      state.from = found.id
      state.to = null
    } else {
      state.to = found.id
    }
    renderControls()
    compute()
  })

  canvas.addEventListener('pointerleave', () => {
    drag = null
    hideTip()
  })

  canvas.addEventListener(
    'wheel',
    e => {
      e.preventDefault()
      map.zoomAt(e.offsetX, e.offsetY, e.deltaY < 0 ? 1.12 : 1 / 1.12)
      hideTip()
    },
    { passive: false }
  )

  function showTip(x, y, html) {
    tooltip.innerHTML = html
    tooltip.hidden = false
    const rect = canvas.getBoundingClientRect()
    const tw = tooltip.offsetWidth
    const th = tooltip.offsetHeight
    tooltip.style.left = `${Math.min(Math.max(8, x + 14), rect.width - tw - 8)}px`
    tooltip.style.top = `${Math.max(8, y - th - 14)}px`
  }
  function hideTip() {
    tooltip.hidden = true
  }

  /* ------------------------------------------------------------- listeners */

  $('#from').addEventListener('change', e => {
    state.from = e.target.value || null
    compute()
  })
  $('#to').addEventListener('change', e => {
    state.to = e.target.value || null
    compute()
  })
  $('#swap').addEventListener('click', () => {
    ;[state.from, state.to] = [state.to, state.from]
    renderControls()
    compute()
  })
  $('#railonly').addEventListener('change', e => {
    state.railOnly = e.target.checked
    compute()
  })
  $('#date').addEventListener('change', e => {
    state.date = e.target.value
    compute()
  })
  $('#nationality').addEventListener('input', e => {
    state.nationality = e.target.value
    if (state.plan) compute()
  })
  $('#pace').addEventListener('change', e => {
    state.pace = e.target.value
    compute()
  })
  $('#reset').addEventListener('click', () => map.resetView())

  panel.addEventListener('click', e => {
    const chip = e.target.closest('[data-preset]')
    if (!chip) return
    const p = PRESETS[Number(chip.dataset.preset)]
    state.from = p.from
    state.to = p.to
    renderControls()
    compute()
  })

  /* ---------------------------------------------------------------- theme */

  const redraw = () => map.redraw()
  new MutationObserver(redraw).observe(document.documentElement, {
    attributes: true,
    attributeFilter: ['data-theme', 'class', 'style'],
  })
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redraw)

  function updateInset() {
    // Below the breakpoint the panes stack, so nothing overlays the map.
    if (!window.matchMedia('(min-width: 60.0625rem)').matches) {
      return map.setInset({ left: 0, right: 0 })
    }
    const controls = document.querySelector('.controls').getBoundingClientRect()
    map.setInset({
      // The controls only cover the top corner, so reserving their full width
      // would waste half the map. Half of it keeps endpoints clear.
      left: controls.width * 0.5,
      right: panel.getBoundingClientRect().width,
    })
  }

  let resizeTimer = null
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer)
    resizeTimer = setTimeout(() => {
      updateInset()
      map.resize()
    }, 120)
  })

  /* ------------------------------------------------------------------ boot */

  readHash()
  renderControls()
  // Fonts are inlined, but the canvas measures text — wait for them so labels
  // are laid out against the real face rather than the fallback metrics.
  const start = () => {
    updateInset()
    map.resize()
    compute()
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(start)
  else start()
})()

})();
</script>
