# The Xcode project, as something a person can read.
#
# An .xcodeproj is a 1,500-line plist of generated UUIDs. It cannot be reviewed
# in a diff, it conflicts on every merge, and a hand-edited one is a project
# that opens once and then does not. XcodeGen turns this file into that one on
# the build machine, so what lives in the repository is the twelve lines that
# actually decide anything.
#
#   brew install xcodegen && cd ios && xcodegen generate
#
# The bundle identifier below has to match the App ID registered in your Apple
# Developer account and the provisioning profile built from it. Nothing here
# can check that for you — the first sign of a mismatch is a signing failure in
# CI, which is where the workflow explains it.

name: Overland

options:
  bundleIdPrefix: com.slowasia
  deploymentTarget:
    # WKWebView's URL scheme handling, dvh units and env(safe-area-inset-*) are
    # all stable from here. Going lower buys a fraction of a percent of devices
    # and costs the layout the app is built on.
    iOS: '15.0'
  createIntermediateGroups: true
  groupSortPosition: top
  # Pinned, because XcodeGen writes whatever format its own version prefers and
  # that is not a decision this project wants to inherit. 2.45 emits 77, which
  # is Xcode 16's, and Xcode 15 refuses to open it with an error that names a
  # number and not a cause. 56 is readable by Xcode 14 upwards, including every
  # newer one, so the project no longer cares which image CI happens to boot.
  objectVersion: 56

configFiles:
  Debug: Version.xcconfig
  Release: Version.xcconfig

settings:
  base:
    SWIFT_VERSION: '5.9'
    # No bitcode, no on-demand resources, nothing that fetches at runtime.
    ENABLE_BITCODE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Overland:
    type: application
    platform: iOS
    sources:
      - path: Overland/Sources
      - path: Overland/Resources
        # www/ is staged by tools/build-ios.mjs and is not in the repository.
        # It has to go in as a folder reference, not a group: the page loads
        # app.js by relative path, and a group would flatten the directory and
        # break that at runtime rather than at build time.
        excludes: ['www']
      - path: Overland/Resources/www
        type: folder
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slowasia.overland
        INFOPLIST_FILE: Overland/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1,2'   # iPhone and iPad, as on Android
        SUPPORTS_MACCATALYST: NO
        # Signed in CI from secrets. Locally this leaves you able to build for
        # the simulator without an account.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ''
        DEVELOPMENT_TEAM: ''
        PROVISIONING_PROFILE_SPECIFIER: ''
