# Builds the Android app bundle for Play, and a plain APK for sideloading.
#
# This runs in CI rather than locally because the Android Gradle Plugin and the
# SDK both live on dl.google.com, which the development container cannot reach.
# GitHub's runners ship the SDK already, so this is the shortest honest path to
# an artefact you can upload.
#
# Signing: set the four secrets below and the release bundle comes out signed
# and uploadable. Leave them unset and the job still runs, still produces an
# unsigned artefact you can install with `adb install`, and says plainly in the
# summary that it is unsigned — rather than quietly signing with a debug key
# that Play will reject at upload with a confusing error.
#
#   ANDROID_KEYSTORE_BASE64    base64 of your .jks — `base64 -w0 upload.jks`
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

name: Android

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest

    # The `secrets` context is not available in a step-level `if`, so the one
    # decision this job makes — signed or not — is lifted into `env`, where it
    # is allowed, and tested from there.
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build the page and stage it into the app
        run: |
          node tools/build.mjs
          node tools/build-android.mjs

      - name: Decode the upload keystore
        if: env.KEYSTORE_B64 != ''
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Assemble
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      # Proves the signature rather than assuming it. apksigner reads the actual
      # v2/v3 block out of the APK and prints the certificate; jarsigner checks
      # the bundle. If a keystore was supplied and the result does not verify,
      # the job fails here and the artefact is never uploaded — handing over a
      # bundle that Play will reject helps nobody.
      - name: Verify the signature
        run: |
          set -euo pipefail
          AAB=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -1)
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          {
            echo "### Signature"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "${ANDROID_KEYSTORE_PATH:-}" ]; then
            echo "No keystore was supplied — nothing to verify." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          {
            echo '```'
            "$APKSIGNER" verify --print-certs "$APK" 2>&1 | grep -viE '^warning' | head -12
            jarsigner -verify "$AAB" | head -2
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Say what came out
        run: |
          {
            echo "### Android build"
            echo
            if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
              echo "Signed with the upload key. The .aab is ready for Play Console."
            else
              echo "**Unsigned** — no keystore secrets are set, so this cannot be"
              echo "uploaded to Play. The APK will still sideload for testing."
            fi
            echo
            find android/app/build/outputs -name '*.aab' -o -name '*.apk' \
              | while read -r f; do
                  printf -- '- `%s` — %s\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
                done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: overland-sea-android
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
