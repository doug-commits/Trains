# Builds the Android app bundle for Play, and a plain APK for sideloading.
#
# This runs in CI rather than locally because the Android Gradle Plugin and the
# SDK both live on dl.google.com, which the development container cannot reach.
# GitHub's runners ship the SDK already, so this is the shortest honest path to
# an artefact you can upload.
#
# Signing: set the four secrets below and the release bundle comes out signed
# and uploadable. Leave them unset and the job still runs, still produces an
# unsigned artefact you can install with `adb install`, and says plainly in the
# summary that it is unsigned — rather than quietly signing with a debug key
# that Play will reject at upload with a confusing error.
#
#   ANDROID_KEYSTORE_BASE64    base64 of your .jks — `base64 -w0 upload.jks`
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

name: Android

on:
  workflow_dispatch:
    inputs:
      unsigned:
        description: 'Build unsigned, to sign on your own machine'
        type: boolean
        default: false
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest

    # The `secrets` context is not available in a step-level `if`, so the one
    # decision this job makes — signed or not — is lifted into `env`, where it
    # is allowed, and tested from there.
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # Builds its own page: dist/app.html, with no photographs and none of the
      # website-only sections. It does not use the site's index.html.
      - name: Build the page and stage it into the app
        run: node tools/build-android.mjs

      # Skipped on request, which is the whole of the unsigned path: with no
      # ANDROID_KEYSTORE_PATH, Gradle leaves the release build unsigned and
      # every step below already knows what to do with that.
      - name: Decode the upload keystore
        if: env.KEYSTORE_B64 != '' && !inputs.unsigned
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Assemble
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      # Proves the signature rather than assuming it. apksigner reads the actual
      # v2/v3 block out of the APK and prints the certificate; jarsigner checks
      # the bundle. If a keystore was supplied and the result does not verify,
      # the job fails here and the artefact is never uploaded — handing over a
      # bundle that Play will reject helps nobody.
      - name: Verify the signature
        run: |
          set -euo pipefail
          AAB=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -1)
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          {
            echo "### Signature"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "${ANDROID_KEYSTORE_PATH:-}" ]; then
            echo "No keystore was supplied — nothing to verify." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          # Play matches on this and refuses anything else, so print it beside
          # the certificate rather than leaving it to be discovered at upload.
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          {
            echo '```'
            "$APKSIGNER" verify --print-certs "$APK" 2>&1 | grep -viE '^warning' | head -12
            echo
            echo "package: $("$AAPT2" dump packagename "$APK" 2>/dev/null || echo unknown)"
            jarsigner -verify "$AAB" | head -2
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # And check it is the key Play is expecting, rather than leaving that
          # to be discovered by the upload dialog.
          #
          # Play pins the upload certificate on the first release and refuses
          # every later bundle signed with anything else. The message it gives
          # names two fingerprints and no cause, and by then the build has been
          # made, downloaded and half-uploaded. The fingerprint is a public
          # certificate hash and not a secret, so it lives in a repository
          # variable: Settings -> Secrets and variables -> Actions -> Variables,
          # ANDROID_UPLOAD_SHA1, in the colon-separated form Play prints.
          SHA1=$("$APKSIGNER" verify --print-certs "$APK" 2>/dev/null \
            | grep -m1 -i 'SHA-1 digest' | sed 's/.*: *//' | tr -d ' ' | tr 'a-f' 'A-F')
          # apksigner prints it unseparated; Play prints it with colons. Compare
          # in one shape so a correct key never fails on punctuation.
          WANT=$(printf '%s' "${{ vars.ANDROID_UPLOAD_SHA1 }}" | tr -d ': ' | tr 'a-f' 'A-F')
          {
            echo
            echo "Upload certificate SHA-1: \`$SHA1\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$WANT" ]; then
            echo "::warning title=Upload key unverified::Set the repository variable\
            ANDROID_UPLOAD_SHA1 to $SHA1 and this build will check itself against\
            the key Play expects, instead of finding out at upload."
          elif [ "$SHA1" != "$WANT" ]; then
            echo "::error title=Wrong signing key::This bundle is signed with $SHA1,\
            but Play expects $WANT. The keystore in ANDROID_KEYSTORE_BASE64 is not\
            the one this listing was first uploaded with. Play will reject it."
            {
              echo
              echo "**This bundle would be rejected by Play.**"
              echo "Signed with \`$SHA1\`, expected \`$WANT\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "Matches the key Play expects." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Say what came out
        run: |
          {
            echo "### Android build"
            echo
            if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
              echo "Signed with the upload key. The .aab is ready for Play Console."
            else
              echo "**Unsigned.** Play will not take this as it stands — sign it on"
              echo "the machine that holds the key:"
              echo
              echo '```sh'
              echo "./tools/sign-aab.sh app-release.aab ~/.android/your-keystore.jks"
              echo '```'
              echo
              echo "The APK beside it will sideload with \`adb install\` either way."
            fi
            echo
            find android/app/build/outputs -name '*.aab' -o -name '*.apk' \
              | while read -r f; do
                  printf -- '- `%s` — %s\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
                done
          } >> "$GITHUB_STEP_SUMMARY"

      # Named for what it is. An unsigned bundle uploaded to Play is rejected
      # with a message about the signature, and the worst version of that is
      # spending twenty minutes on it because the file was called the same as
      # the signed one.
      - uses: actions/upload-artifact@v4
        with:
          name: overland-sea-android${{ inputs.unsigned && '-unsigned' || '' }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
