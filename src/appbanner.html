<!-- Asked once, on Android, and not again after a no.

     A strip rather than an overlay, and deliberately. Google demotes a mobile
     page that covers its own content with an app promotion, and is right to:
     the reader came for the page, not for us. This takes a line at the top and
     gives it back the moment it is dismissed.

     The pitch is the true one. The app is the same program with the network
     already inside it, so what installing buys is not features — it is that
     the phone stops needing a signal, which matters most at exactly the moment
     there is none: a border post, a sleeper somewhere north of Nong Khai. "Get
     our app" on its own is a sentence people have learned to close unread. -->
<script>
  /* During parse, ahead of the stylesheet, so the strip is either there in the
     first frame or never there at all. One that appears a moment after the
     page settles moves the whole layout under a thumb already on its way down
     — which is how a banner gets tapped by accident and resented. */
  (function () {
    var el = document.documentElement
    /* Not iPadOS-style spoofing to worry about here: Android says Android.
       The app itself is excluded twice over — the build marks the document,
       and the shell it runs in defines OverlandShell — because offering to
       install the app you are already inside is the kind of thing that gets a
       screenshot taken of it. */
    var ask =
      /Android/.test(navigator.userAgent) &&
      !el.dataset.app &&
      typeof OverlandShell === 'undefined'
    /* Storage is asked separately and allowed to fail. In private mode the
       answer cannot be remembered, and being asked again is a smaller wrong
       than never being told the app exists.

       Two answers are remembered here and they are not the same thing. "no" is
       the reader's, and permanent. "have" is the browser's, and provisional —
       it is last visit's finding that the app was installed, kept only so that
       this visit can act on it before painting. */
    var said = null
    try {
      said = localStorage.getItem('overlandsea:app')
    } catch (e) {}
    if (said === 'no' || said === 'have') ask = false
    if (ask) el.dataset.android = '1'
  })()
</script>
<aside class="appbanner" aria-label="Android app">
  <span class="mark" aria-hidden="true"></span>
  <p class="appbanner-say">
    <b>Plan with no signal.</b>
    <span>The Android app works offline.</span>
  </p>
  <a
    class="appbanner-go"
    href="https://play.google.com/store/apps/details?id=com.overlandsoutheastasia"
  >Install</a>
  <button type="button" class="appbanner-no" aria-label="Not now, and do not ask again">
    <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
      <path d="M6 6l8 8M14 6l-8 8" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round"/>
    </svg>
  </button>
</aside>
<script>
  /* Wired here rather than from the program, because the guide pages carry
     this strip too and they do not load the program at all. */
  (function () {
    var el = document.documentElement
    var remember = function (v) {
      try {
        if (v) localStorage.setItem('overlandsea:app', v)
        else localStorage.removeItem('overlandsea:app')
      } catch (e) {}
    }

    var no = document.querySelector('.appbanner-no')
    if (no) {
      no.addEventListener('click', function () {
        el.removeAttribute('data-android')
        remember('no')
      })
    }

    /* Do not ask someone who already said yes.
     *
     * getInstalledRelatedApps reads the manifest's related_applications and
     * checks it against what is actually on the phone — but only where the
     * app has also named this site back, in its own asset statements. Both
     * halves or nothing: it is a deliberately hard question to answer, because
     * "which of my apps do you have" is not one a page should be able to ask
     * about apps that are not its own.
     *
     * Chrome on Android, and nowhere else. Everywhere else this is absent and
     * the line below is the whole of the handling.
     *
     * It is async, so it cannot run before the first frame, which is why the
     * answer is written down: a reader who has the app sees the strip once and
     * never again. Better than the alternative — waiting on a promise before
     * painting anything, so that everyone who has not installed it looks at a
     * blank top of the page while the browser decides. */
    if (!navigator.getInstalledRelatedApps) return
    navigator.getInstalledRelatedApps().then(
      function (apps) {
        var have = apps.some(function (a) {
          return a.platform === 'play' && a.id === 'com.overlandsoutheastasia'
        })
        if (have) {
          el.removeAttribute('data-android')
          remember('have')
          return
        }
        /* Uninstalled since. Forget the finding, but do not put the strip back
           in front of a reader mid-page — it would jump the layout under them
           for a message they were not waiting for. It returns on the next
           page they open. */
        try {
          if (localStorage.getItem('overlandsea:app') === 'have') remember(null)
        } catch (e) {}
      },
      function () {
        /* Rejects where the manifest and the app do not agree, which is the
           same outcome as not being installed: keep asking. */
      }
    )
  })()
</script>
